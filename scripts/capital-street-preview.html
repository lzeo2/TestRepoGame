<!doctype html>
<meta charset="utf-8">
<title>Capital Drive geographic preview harness</title>
<style>html,body{margin:0;overflow:hidden}canvas{display:block}</style>
<script type="module">
import * as THREE from '../assets/car-arcade/vendor/three.module.js';
import {applyRoadProfiles} from '../Games/Capital Drive/road-network.js';
import {applyStreetAssetRoofs} from '../Games/Capital Drive/street-assets.js';
import {createTerrainSampler} from '../Games/Capital Drive/terrain.js';
import {createWorldView} from '../Games/Capital Drive/world-view.js';
import {LANDMARK_CLEARINGS, LANDMARKS, replacedBuildingIds} from '../Games/Capital Drive/landmarks.js';
import {createLandmarksView} from '../Games/Capital Drive/landmarks-view.js';
import {MAPPED_STORES} from '../Games/Capital Drive/stores.js';
import {SHOPPING_BUILDING_IDS} from '../Games/Capital Drive/shopping-precincts.js';
import {createShoppingView, SHOPPING_CLEARINGS} from '../Games/Capital Drive/shopping-view.js';
import {createStorefrontsView} from '../Games/Capital Drive/storefronts-view.js';
import {createSimulation} from '../Games/Capital Drive/simulation.js';
import {generateParkedCars} from '../Games/Capital Drive/parking-layout.js';
import {createParkedCarsView} from '../Games/Capital Drive/parked-cars-view.js';
import {createStreetlights} from '../Games/Capital Drive/streetlights.js';
import {createStreetlightsView} from '../Games/Capital Drive/streetlights-view.js';

const game=new URL('../Games/Capital Drive/',location.href);
async function data(name){
  const response=await fetch(new URL('data/'+name+'.json',game));
  if(!response.ok)throw Error(name+' unavailable');
  return response.json();
}
const [base,profiles,foliage]=await Promise.all([
  data('canberra'),data('road-profiles'),new THREE.TextureLoader().loadAsync(new URL('assets/canopy-clusters.png',game).href)
]);
const map=applyStreetAssetRoofs(applyRoadProfiles(base,profiles));
map.landmarkBuildingIds=[...replacedBuildingIds(map),...SHOPPING_BUILDING_IDS];
map.landmarkTreeExclusions=[...LANDMARK_CLEARINGS,...SHOPPING_CLEARINGS];
foliage.colorSpace=THREE.SRGBColorSpace;foliage.anisotropy=2;
const terrain=createTerrainSampler(map),scene=new THREE.Scene(),renderer=new THREE.WebGLRenderer({antialias:false});
renderer.setPixelRatio(1);renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
document.body.append(renderer.domElement);
scene.background=new THREE.Color(0xa9c9d5);scene.fog=new THREE.Fog(0xa9c9d5,230,750);
scene.add(new THREE.HemisphereLight(0xf8f5dc,0x697258,1.3));
const sun=new THREE.DirectionalLight(0xfff0ce,2);sun.position.set(-300,450,180);scene.add(sun);
const camera=new THREE.PerspectiveCamera(51,innerWidth/innerHeight,.18,1600);
const world=createWorldView(scene,map,{streaming:true,lowGraphics:true,terrainSampler:terrain,foliageTexture:foliage,openingChunks:0});
const simulation=createSimulation(map);
const parked=generateParkedCars(map,{isClear:(_x,_z,_r,pose)=>simulation.canOccupy(pose)});
const cars=createParkedCarsView(scene,parked,car=>world.vehicleHeightAt(car,car.edge?.road));
const lights=createStreetlightsView(scene,createStreetlights(map.roads,{waterAt:simulation.waterAt,isOnBridge:terrain.isOnBridge,
  canOccupy:simulation.canOccupy,nearestRoad:simulation.nearestRoad}),terrain.heightAt);
const views=[
  createLandmarksView(scene,map,world.heightAt),createShoppingView(scene,map,world.heightAt),
  createStorefrontsView(scene,world.heightAt),lights
];
const parliament=LANDMARKS.find(p=>p.id==='parliament-house');
const parliamentPoint=(u,v)=>[parliament.x+Math.cos(-.615)*u+Math.sin(-.615)*v,parliament.z-Math.sin(-.615)*u+Math.cos(-.615)*v];
const shop=MAPPED_STORES.find(s=>s.name==='Paperback Chain').frontage;
const normal=[-Math.sin(shop.yaw),-Math.cos(shop.yaw)],along=[-normal[1],normal[0]];
const shopPoint=(n,t)=>[shop.x+normal[0]*n+along[0]*t,shop.z+normal[1]*n+along[1]*t];
const shots={
  parliament:{from:parliamentPoint(109,-222),to:parliamentPoint(13,-76),eye:1.78,look:21,fov:52},
  manuka:{from:shopPoint(11,12),to:shopPoint(0,-.5),eye:1.78,look:1.65,fov:56},
};
window.captureCapitalStreet=async function(name,override={}){
  const {from,to,eye,look,fov}={...shots[name],...override};
  const focus={x:from[0],z:from[1]};
  for(let i=0;i<48;i++){
    world.update(focus,{maxLoads:2});
    if(!world.pendingChunks)break;
    await new Promise(requestAnimationFrame);
  }
  if(world.pendingChunks)throw Error('Geographic world chunks did not settle');
  for(const view of views)view.update(focus);cars.cull(focus);
  camera.position.set(from[0],world.heightAt(...from)+eye,from[1]);
  camera.fov=fov;camera.updateProjectionMatrix();camera.lookAt(to[0],world.heightAt(...to)+look,to[1]);
  renderer.render(scene,camera);
  await new Promise(requestAnimationFrame);
  renderer.render(scene,camera);
  return {name,from,to,height:eye,world:{buildings:world.stats.buildings,roadSegments:world.stats.roadSegments,
    trees:world.stats.trees,chunks:world.stats.chunks},draws:renderer.info.render.calls,triangles:renderer.info.render.triangles};
};
</script>
