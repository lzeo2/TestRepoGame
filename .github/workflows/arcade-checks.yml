name: Arcade checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the catalog and checks
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            /games.json
            /sitemap.xml
            /assets/portal-ux.js
            /scripts/generate_sitemap.py
            /scripts/audit_arcade_entry_assets.py
            /Games/**/*.html
            /Games/**/*.htm
          sparse-checkout-cone-mode: false
      - name: Check the catalog, sitemap and portal
        run: |
          python3 -B scripts/generate_sitemap.py --check
          python3 -B scripts/audit_arcade_entry_assets.py --check
          node --check assets/portal-ux.js
