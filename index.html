<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b10" />
    <meta name="color-scheme" content="dark" />
    <title>UNBLOCKMATH // ARCADE</title>
    <!-- Offline-first: no external font loads. The bundled stylesheet falls
         back to local/system fonts (Inter -> system-ui stack). -->
    <script type="module" crossorigin src="./assets/index-CRWHmtoy.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CUsUGgbt.css">
    <style>
      /* Shared proxy launcher — themed with the app's own design tokens.
         Deliberately small and self-contained so the minified build output
         in ./assets/ never has to be touched. */
      .proxy-launcher {
        position: fixed;
        /* 44px+ touch target, clear of home-indicator/safe-area insets on
           mobile, and stays put while the page scrolls. */
        right: max(18px, env(safe-area-inset-right));
        bottom: max(18px, env(safe-area-inset-bottom));
        z-index: 999;
      }
      .proxy-launcher__btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 44px;
        padding: 10px 16px;
        border: 1px solid var(--accent-border, rgba(170, 59, 255, 0.5));
        border-radius: 999px;
        background: var(--accent, #aa3bff);
        color: #08060d; /* near-black text passes contrast on both light (#aa3bff) and dark (#c084fc) accents */
        font-family: var(--sans, system-ui, "Segoe UI", Roboto, sans-serif);
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.2px;
        line-height: 1.2;
        text-decoration: none;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.15),
          0 4px 6px -2px rgba(0, 0, 0, 0.08);
        cursor: pointer;
        transition: filter 0.15s ease, transform 0.15s ease,
          box-shadow 0.15s ease;
      }
      @media (max-width: 480px) {
        /* On small phones keep the launcher off the very edges so it cannot
           be covered by browser chrome or the OS gesture bar. */
        .proxy-launcher {
          right: max(12px, env(safe-area-inset-right));
          bottom: max(12px, env(safe-area-inset-bottom));
        }
      }
      .proxy-launcher__btn:hover,
      .proxy-launcher__btn:focus-visible {
        filter: brightness(1.06);
        transform: translateY(-1px);
        box-shadow: 0 14px 20px -4px rgba(0, 0, 0, 0.2),
          0 6px 8px -4px rgba(0, 0, 0, 0.1);
      }
      .proxy-launcher__btn:focus-visible {
        outline: 2px solid currentColor;
        outline-offset: 3px;
      }
      .proxy-launcher__icon {
        width: 16px;
        height: 16px;
        flex: none;
      }
      @media (prefers-reduced-motion: reduce) {
        .proxy-launcher__btn {
          transition: none;
        }
        .proxy-launcher__btn:hover,
        .proxy-launcher__btn:focus-visible {
          transform: none;
        }
      }

      /* -------------------------------------------------------------
         Authored theme & layout overrides (Phase 4 portal UI/UX).
         Loaded after the bundled stylesheet, so these rules win at
         equal specificity. The minified bundles in ./assets are never
         touched, and the shared proxy launcher above is unchanged.
      -------------------------------------------------------------- */

      /* Extend the bundled (dark-only) design tokens. */
      :root {
        color-scheme: dark;
        --bg-card-hover: #1b1b23;
        --surface-2: #15151b;
        --overlay: #000000e6;
        --focus-ring: #00ff88;
        --focus-ring-soft: color-mix(in srgb, #00ff88 35%, transparent);
        --radius: 20px;
        --radius-lg: 28px;
      }

      /* Never scroll sideways; keep scrollbar space stable. */
      html {
        scroll-behavior: smooth;
        scrollbar-gutter: stable;
        overflow-x: hidden;
      }
      body {
        overflow-x: hidden;
        text-rendering: optimizeLegibility;
      }

      /* Drop the bundled 1126px column frame; let .app own the page width. */
      #root {
        width: auto;
        max-width: none;
        margin: 0;
        border-inline: none;
        text-align: left;
      }

      /* Skip-to-content link: parked off-screen until keyboard focus. */
      .skip-link {
        position: fixed;
        top: max(12px, env(safe-area-inset-top));
        left: 50%;
        transform: translate(-50%, -240px);
        z-index: 1001;
        padding: 10px 18px;
        border-radius: 999px;
        background: var(--focus-ring, #00ff88);
        color: #08060d;
        font-family: var(--sans, system-ui, "Segoe UI", Roboto, sans-serif);
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.2px;
        line-height: 1.2;
        text-decoration: none;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.25);
        transition: transform 0.15s ease;
      }
      .skip-link:focus {
        transform: translate(-50%, 0);
      }

      ::selection {
        background: var(--focus-ring);
        color: #08060d;
      }

      /* Touch ergonomics applied at the theme level. */
      button {
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }

      /* Reduced motion: kill CSS-driven motion wherever the bundle allows. */
      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }
        *,
        *::before,
        *::after {
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div id="root"></div>

    <nav class="proxy-launcher" aria-label="Proxy tools">
      <a
        class="proxy-launcher__btn"
        href="./uv/"
        aria-label="Open UV proxy"
      >
        <svg
          class="proxy-launcher__icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="2" y1="12" x2="22" y2="12"></line>
          <path
            d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"
          ></path>
        </svg>
        Proxy
      </a>
    </nav>
  </body>
</html>
