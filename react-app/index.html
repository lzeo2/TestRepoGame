<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UNBLOCKMATH // ARCADE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Shared proxy launcher — themed with the app's own design tokens.
         Deliberately small and self-contained so the minified build output
         never has to be touched. */
      .proxy-launcher {
        position: fixed;
        /* 44px+ touch target, clear of home-indicator/safe-area insets on
           mobile, and stays put while the page scrolls. */
        right: max(18px, env(safe-area-inset-right));
        bottom: max(18px, env(safe-area-inset-bottom));
        z-index: 999;
      }
      .proxy-launcher__btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 44px;
        padding: 10px 16px;
        border: 1px solid var(--accent-border, rgba(170, 59, 255, 0.5));
        border-radius: 999px;
        background: var(--accent, #aa3bff);
        color: #08060d; /* near-black text passes contrast on both light (#aa3bff) and dark (#c084fc) accents */
        font-family: var(--sans, system-ui, "Segoe UI", Roboto, sans-serif);
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.2px;
        line-height: 1.2;
        text-decoration: none;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.15),
          0 4px 6px -2px rgba(0, 0, 0, 0.08);
        cursor: pointer;
        transition: filter 0.15s ease, transform 0.15s ease,
          box-shadow 0.15s ease;
      }
      @media (max-width: 480px) {
        /* On small phones keep the launcher off the very edges so it cannot
           be covered by browser chrome or the OS gesture bar. */
        .proxy-launcher {
          right: max(12px, env(safe-area-inset-right));
          bottom: max(12px, env(safe-area-inset-bottom));
        }
      }
      .proxy-launcher__btn:hover,
      .proxy-launcher__btn:focus-visible {
        filter: brightness(1.06);
        transform: translateY(-1px);
        box-shadow: 0 14px 20px -4px rgba(0, 0, 0, 0.2),
          0 6px 8px -4px rgba(0, 0, 0, 0.1);
      }
      .proxy-launcher__btn:focus-visible {
        outline: 2px solid currentColor;
        outline-offset: 3px;
      }
      .proxy-launcher__icon {
        width: 16px;
        height: 16px;
        flex: none;
      }
      @media (prefers-reduced-motion: reduce) {
        .proxy-launcher__btn {
          transition: none;
        }
        .proxy-launcher__btn:hover,
        .proxy-launcher__btn:focus-visible {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <nav class="proxy-launcher" aria-label="Proxy tools">
      <a
        class="proxy-launcher__btn"
        href="./uv/"
        aria-label="Open UV proxy"
      >
        <svg
          class="proxy-launcher__icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="2" y1="12" x2="22" y2="12"></line>
          <path
            d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"
          ></path>
        </svg>
        Proxy
      </a>
    </nav>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
