<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Wordle</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='28' height='28' rx='6' fill='%2328303a'/%3E%3Crect x='7' y='7' width='7' height='7' rx='1' fill='%236aaa63'/%3E%3Crect x='18' y='7' width='7' height='7' rx='1' fill='%23c9b458'/%3E%3Crect x='7' y='18' width='7' height='7' rx='1' fill='%23c9b458'/%3E%3Crect x='18' y='18' width='7' height='7' rx='1' fill='%233a3a3c'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="hud">
    <h1>WORDLE</h1>
    <div class="stats">
      <button id="restartBtn" class="iconbtn" type="button" title="New word" aria-label="New word">&#8635;</button>
    </div>
  </header>
  <p id="message" class="message" role="status" aria-live="assertive">&nbsp;</p>

  <div id="board" class="board" aria-label="Game board"></div>

  <div id="keyboard" class="keyboard" aria-label="On-screen keyboard"></div>

  <p class="hint">Type with your keyboard or tap the letters &middot; Enter submits &middot; Backspace deletes &middot; 6 guesses</p>
</div>

<div id="overlay" class="overlay hidden">
  <div id="panel" class="panel">
    <h2 id="panelTitle">You won!</h2>
    <p id="panelAnswer" class="answerline"></p>
    <div id="panelShare" class="shareblock"></div>
    <p id="copyStatus" class="copystatus">&nbsp;</p>
    <div class="panelbtns">
      <button id="shareBtn" class="cbtn primary" type="button">Copy results</button>
      <button id="newBtn" class="cbtn" type="button">New word</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
