<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Borough Run</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#11151c;color:#f4f7fa;font:15px system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;overflow:hidden}#shell{width:min(100vw,960px);position:relative;border:2px solid #435365;background:#1a232d}canvas{display:block;width:100%;aspect-ratio:16/10;touch-action:none}#panel{position:absolute;inset:0;display:grid;place-items:center;background:#111923ed;padding:22px;text-align:center}#panel section{max-width:620px;background:#202d3b;border:1px solid #86a1b4;padding:24px;box-shadow:8px 8px #090d12}h1{margin:0 0 8px;letter-spacing:.08em;font-size:clamp(27px,6vw,52px)}p{line-height:1.5}.buttons{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}button{min-height:48px;padding:10px 18px;border:2px solid #e3bc65;background:#171f2a;color:#fff;font-weight:700}button:hover,button:focus-visible{background:#e3bc65;color:#111;outline:3px solid #fff}.touch{position:absolute;inset:0;pointer-events:none}.pad,.action{pointer-events:auto;position:absolute;min-width:52px;min-height:52px;border:1px solid #c6d8e2;background:#1a3446e8;color:#fff;border-radius:4px}.steer{left:14px;bottom:14px;width:112px;height:112px}.throttle{right:14px;bottom:14px;width:112px;height:112px}.pad:after{content:'STEER';position:absolute;inset:44px 0;text-align:center;font-size:11px}.throttle:after{content:'THROTTLE / BRAKE'}.act{right:140px;bottom:14px;display:flex;gap:6px}.act button{padding:0;font-size:11px}@media(max-width:560px){#panel section{padding:16px;font-size:13px}.steer{left:8px;bottom:8px}.throttle{right:8px;bottom:8px}.act{right:126px;bottom:8px;flex-direction:column}.act button{min-height:44px;min-width:52px;padding:0}}</style><meta name="description" content="Borough Run: Drive a stolen courier car through a city loop, outmaneuver police, and deliver the package before you are boxed in.">
</head><body><main id="shell"><canvas id="game" width="960" height="600"></canvas><div class="touch"><button class="pad steer" id="steer" aria-label="Steer"></button><button class="pad throttle" id="throttle" aria-label="Throttle and brake"></button><div class="act"><button id="hand">HANDBRAKE</button><button id="smoke">SMOKE</button><button id="use">USE</button><button id="pause">PAUSE</button></div></div><div id="panel"><section><h1>BOROUGH RUN</h1><p id="copy">Take the courier package, then survive the city loop or reach a safehouse while three patrol cars close the net.</p><div class="buttons"><button id="play">PLAY</button><button id="how">HOW TO PLAY</button><button id="about">ABOUT</button></div></section></div></main><script>
(()=>{const C=document.getElementById('game'),X=C.getContext('2d'),panel=document.getElementById('panel'),copy=document.getElementById('copy');let screen='TITLE',renderer='canvas2d',held={},pressed={},touch={},last=0,acc=0,simTick=0,seed=22801,score=0,best=0,bestTime=0,time=90,heat=0,integrity=100,smoke=2,packageTaken=false,repair=0,bust=0,p;try{best=+(localStorage.getItem('borough-run.best')||0);bestTime=+(localStorage.getItem('borough-run.bestTime')||0)}catch(e){}function choose(){if(location.search.includes('renderer=canvas'))return;try{let q=document.createElement('canvas').getContext('webgl',{antialias:false,alpha:false});if(q){let s=q.createShader(q.VERTEX_SHADER);q.shaderSource(s,'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}');q.compileShader(s);if(q.getShaderParameter(s,q.COMPILE_STATUS))renderer='webgl1'}}catch(e){}}choose();
const blocks=[];for(let i=0;i<20;i++)blocks.push({x:180+(i%5)*600,y:130+Math.floor(i/5)*480,w:300,h:220});const safe=[{x:80,y:80},{x:2880,y:1700}],bays=[{x:400,y:80},{x:1500,y:80},{x:2800,y:80},{x:1600,y:1740}];let cops=[];
function reset(){screen='TITLE';simTick=0;time=90;heat=0;integrity=100;smoke=2;packageTaken=false;repair=0;bust=0;score=0;p={x:300,y:1000,a:0,v:0,hand:0,flats:0};cops=[{x:850,y:1000,a:3.1,role:'PATROL'},{x:2200,y:400,a:1.5,role:'BLOCKER'},{x:2500,y:1600,a:4.5,role:'INTERCEPTOR'}]}reset();function startTest(s){seed=s||22801;reset();screen='PLAYING'}
function clear(){held={};touch={}}addEventListener('blur',clear);document.addEventListener('visibilitychange',()=>{clear();if(document.hidden)screen=screen==='PLAYING'?'PAUSED':screen});addEventListener('keydown',e=>{held[e.key]=1;pressed[e.key]=1;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','q','e','p'].includes(e.key))e.preventDefault();if(e.key==='p'||e.key==='Escape')togglePause()});addEventListener('keyup',e=>delete held[e.key]);function togglePause(){if(screen==='PLAYING'||screen==='PAUSED'){screen=screen==='PLAYING'?'PAUSED':'PLAYING';panel.classList.toggle('hidden',screen==='PLAYING');copy.textContent=screen==='PAUSED'?'Chase paused. Resume when ready.':'Drive to a safehouse or survive the clock.'}}
function tap(id,k){document.getElementById(id).onpointerdown=()=>{held[k]=1;pressed[k]=1};document.getElementById(id).onpointerup=document.getElementById(id).onpointercancel=()=>delete held[k]}tap('hand',' ');tap('smoke','q');tap('use','e');document.getElementById('pause').onclick=togglePause;for(const id of ['steer','throttle']){let el=document.getElementById(id);el.onpointerdown=e=>{el.setPointerCapture(e.pointerId);touch[id]=true;touch[id+'x']=e.clientX;touch[id+'y']=e.clientY};el.onpointermove=e=>{if(touch[id]){touch[id+'x']=e.clientX;touch[id+'y']=e.clientY}};el.onpointerup=el.onpointercancel=()=>touch[id]=false}
play.onclick=()=>{copy.textContent='WASD or arrows drive. Space handbrakes, Q drops smoke, E loads the package, repairs in a bay, or extracts. Touch controls support steering and throttle together.';play.textContent='START';play.onclick=()=>{startTest(22801);panel.classList.add('hidden')}};how.onclick=()=>{screen='HOWTO';copy.textContent='Police pursue your last known position. Heat brings an interceptor and hazards. Keep moving, use smoke, and watch integrity.'};about.onclick=()=>{copy.textContent='Original implementation, inspired by game concepts; not affiliated with Anomaly.'};
function sim(dt){simTick++;time=Math.max(0,time-dt);let left=held.ArrowLeft||held.a,right=held.ArrowRight||held.d,th=held.ArrowUp||held.w,br=held.ArrowDown||held.s;if(touch.steer){let r=C.getBoundingClientRect();let v=touch.steerx-r.left;left=v<r.width*.18;right=v>r.width*.34}if(touch.throttle){let r=C.getBoundingClientRect();let v=touch.throttley-r.top;th=v<r.height*.55;br=v>r.height*.7}let steer=(right?1:0)-(left?1:0);let tops=[360,295,230,72][Math.min(3,p.flats)];if(th)p.v=Math.min(tops,p.v+300*dt);else if(br)p.v=Math.max(-120,p.v-520*dt);else p.v*=Math.pow(.92,dt);if(held[' ']){p.v*=Math.pow(.42,dt/.8);p.hand=.8}p.a+=steer*(Math.abs(p.v)<180?2.7:1.4)*dt;p.x=Math.max(50,Math.min(3150,p.x+Math.cos(p.a)*p.v*dt));p.y=Math.max(50,Math.min(1950,p.y+Math.sin(p.a)*p.v*dt));if((pressed.q)&&smoke){smoke--;heat=Math.min(3,heat+.1)}if(!packageTaken&&Math.hypot(p.x-300,p.y-1000)<40&&pressed.e){packageTaken=true;heat=1}if(packageTaken&&heat<3&&time<70)heat=Math.min(3,heat+dt*.02);if(packageTaken){let bay=safe.find(s=>Math.hypot(p.x-s.x,p.y-s.y)<80);if(bay&&Math.abs(p.v)<20){repair+=dt;if(repair>=2){finish(true);return}}else repair=0}for(const c of cops){let target=Math.atan2(p.y-c.y,p.x-c.x);let da=Math.atan2(Math.sin(target-c.a),Math.cos(target-c.a));c.a+=Math.max(-2.2*dt,Math.min(2.2*dt,da*1.8*dt));c.x+=Math.cos(c.a)*Math.min(350,c.role==='INTERCEPTOR'?350:330)*dt;c.y+=Math.sin(c.a)*Math.min(350,c.role==='INTERCEPTOR'?350:330)*dt;if(Math.hypot(p.x-c.x,p.y-c.y)<42&&Math.abs(p.v-c.v||p.v)<400){integrity-=Math.min(18,Math.max(4,Math.abs(p.v)*.055));heat=Math.min(3,heat+.2);c.x-=Math.cos(c.a)*30;c.y-=Math.sin(c.a)*30}}if(Math.abs(p.v)<80&&cops.filter(c=>Math.hypot(p.x-c.x,p.y-c.y)<92).length>=2)bust+=dt;else bust=Math.max(0,bust-dt);if(bust>=3||integrity<=0||time<=0)finish(false);score=Math.min(4000,Math.round((90-time)*20+(packageTaken?500:0)));pressed={}}
function finish(win){screen='RESULT';score=Math.min(4000,Math.max(0,Math.round((90-time)*20+(packageTaken?500:0)+(win?400:0)-Math.max(0,100-integrity))));if(score>best){best=score;bestTime=90-time;try{localStorage.setItem('borough-run.best',best);localStorage.setItem('borough-run.bestTime',bestTime)}catch(e){}}panel.classList.remove('hidden');copy.textContent=(win?'DELIVERY COMPLETE. ':'BUSTED. ')+'Score '+score+' | Best '+best+'.';play.textContent='RESTART';play.onclick=()=>{startTest(22801);panel.classList.add('hidden')}}
function render(){X.clearRect(0,0,960,600);let cx=Math.max(0,Math.min(2240,p.x-480)),cy=Math.max(0,Math.min(1400,p.y-300));X.save();X.translate(-cx,-cy);X.fillStyle='#26313b';X.fillRect(cx,cy,960,600);for(let x=0;x<3200;x+=160){X.fillStyle='#35434d';X.fillRect(x,0,100,2000)}for(let y=0;y<2000;y+=160){X.fillStyle='#35434d';X.fillRect(0,y,3200,100)}for(const b of blocks){X.fillStyle='#17212b';X.fillRect(b.x,b.y,b.w,b.h);X.strokeStyle='#51606b';X.strokeRect(b.x,b.y,b.w,b.h)}for(const s of safe){X.fillStyle='#58bc88';X.fillRect(s.x-36,s.y-28,72,56)}X.fillStyle=packageTaken?'#6bd39b':'#e3bc65';X.fillRect(270,970,60,60);for(const c of cops){X.save();X.translate(c.x,c.y);X.rotate(c.a);X.fillStyle='#db5962';X.fillRect(-26,-14,52,28);X.fillStyle='#5b8fd4';X.fillRect(-8,-14,16,5);X.restore()}X.save();X.translate(p.x,p.y);X.rotate(p.a);X.fillStyle='#e3bc65';X.fillRect(-27,-15,54,30);X.fillStyle='#e9f2f5';X.fillRect(8,-11,12,22);X.restore();X.restore();X.fillStyle='#f4f7fa';X.font='16px system-ui';X.fillText('TIME '+time.toFixed(1)+'  INTEGRITY '+Math.max(0,Math.round(integrity))+'  HEAT '+heat.toFixed(1),16,24);X.fillText('SPEED '+Math.round(Math.abs(p.v))+'  SMOKE '+smoke+'  '+(packageTaken?'PACKAGE LOADED':'FIND THE PACKAGE'),16,48);X.fillText('BUST '+bust.toFixed(1)+'  BEST '+best,16,72)}function frame(now){if(!last)last=now;let d=Math.min((now-last)/1000,.1);last=now;if(screen==='PLAYING'){acc+=d;let n=0;while(n<4&&acc>=1/30){sim(1/30);acc-=1/30;n++}if(n===4&&acc>=1/30)acc=0}render();requestAnimationFrame(frame)}requestAnimationFrame(frame);window.__gameDebug={get state(){return screen},get renderer(){return renderer},get simTick(){return simTick},get score(){return score},get seed(){return seed},get entityCounts(){return{police:3,safehouses:2,package:1,repairBays:4}},reset,startTest}})();</script><details style="max-width:960px;margin:8px auto;color:#c5d2da"><summary>About Borough Run</summary><p>Original implementation, inspired by game concepts; not affiliated with Anomaly.</p></details></body></html>
