<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Orbit Collector</title>
  <style>
    :root {
      --bg: #0a0e1a;
      --accent: #00e5ff;
      --txt: #d0e8f0;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: var(--bg); color: var(--txt);
      font-family: system-ui, -apple-system, sans-serif;
    }
    canvas { position: fixed; inset: 0; display: block; touch-action: none; }
    .overlay {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; background: var(--bg); padding: 24px;
    }
    #hud {
      position: fixed; top: 0; left: 0; right: 0;
      padding: 14px 18px; font-size: 18px; letter-spacing: 0.04em;
      pointer-events: none; z-index: 10;
    }
    #hud .label { color: var(--txt); opacity: 0.7; }
    #score-display { color: var(--accent); font-weight: 700; }
    #start-screen h1 {
      font-size: clamp(28px, 7vw, 48px); font-weight: 700;
      color: var(--accent); margin-bottom: 18px;
    }
    #start-screen p { max-width: 420px; line-height: 1.5; margin-bottom: 28px; opacity: 0.85; }
    button {
      font-family: inherit; font-size: 18px; color: var(--bg);
      background: var(--accent); border: none; padding: 12px 28px; cursor: pointer;
    }
    button:active { opacity: 0.8; }
    #game-over { display: none; z-index: 20; }
    #game-over h2 {
      font-size: clamp(26px, 6vw, 42px); font-weight: 700;
      color: var(--accent); margin-bottom: 14px;
    }
    #game-over p { margin-bottom: 24px; font-size: 18px; }
    #final-score { color: var(--accent); font-weight: 700; }
    #controls-info {
      position: fixed; bottom: 0; left: 0; right: 0;
      padding: 12px 16px; font-size: 13px; text-align: center;
      opacity: 0.6; pointer-events: none; z-index: 10;
    }
  </style>
</head>
<body>
  <div id="hud">
    <span class="label">Score: </span><span id="score-display">0</span>
  </div>

  <div id="start-screen" class="overlay">
    <h1>Orbit Collector</h1>
    <p>WASD or Arrow keys to move your ship. Collect all the orbiting crystals to win.</p>
    <button id="start-btn">Start</button>
  </div>

  <div id="game-over" class="overlay">
    <h2>Game Over</h2>
    <p>Final score: <span id="final-score">0</span></p>
    <button id="restart-btn">Restart</button>
  </div>

  <div id="controls-info">WASD or Arrow keys to move</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- Scene setup -->
  <script>
  (function () {
    'use strict';
    var renderer = new THREE.WebGLRenderer({ antialias: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.0));
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    var scene = new THREE.Scene();
    var camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(0, 0, 15);
    camera.lookAt(0, 0, 0);

    scene.add(new THREE.AmbientLight(0x334455, 0.6));
    var dirLight = new THREE.DirectionalLight(0xffffff, 0.4);
    dirLight.position.set(5, 10, 5);
    scene.add(dirLight);

    var planet = new THREE.Mesh(
      new THREE.SphereGeometry(1.5, 16, 12),
      new THREE.MeshPhongMaterial({ color: 0x1a2a3a, flatShading: true })
    );
    scene.add(planet);

    var collectibles = [];
    for (var i = 0; i < 10; i++) {
      var mesh = new THREE.Mesh(
        new THREE.IcosahedronGeometry(0.3, 0),
        new THREE.MeshPhongMaterial({ color: 0x00e5ff, emissive: 0x003344 })
      );
      var orbitRadius = 4 + Math.random() * 4;
      var orbitOffset = Math.random() * Math.PI * 2;
      var orbitSpeed = (Math.random() * 0.6 + 0.2) * (Math.random() < 0.5 ? -1 : 1);
      mesh.orbitRadius = orbitRadius;
      mesh.orbitSpeed = orbitSpeed;
      mesh.orbitOffset = orbitOffset;
      mesh.bobSpeed = Math.random() * 2 + 0.5;
      mesh.bobAmount = Math.random() * 0.4 + 0.1;
      mesh.baseY = (Math.random() - 0.5) * 3;
      mesh.position.set(Math.cos(orbitOffset) * orbitRadius, mesh.baseY, Math.sin(orbitOffset) * orbitRadius);
      scene.add(mesh);
      collectibles.push(mesh);
    }

    var player = new THREE.Mesh(
      new THREE.ConeGeometry(0.3, 0.8, 4),
      new THREE.MeshPhongMaterial({ color: 0xffffff })
    );
    player.position.set(0, 0, 6);
    player.rotation.x = -Math.PI / 2;
    scene.add(player);

    var starCount = 200;
    var starPos = new Float32Array(starCount * 3);
    for (var s = 0; s < starCount; s++) {
      var r = 30 * Math.cbrt(Math.random());
      var theta = Math.random() * Math.PI * 2;
      var phi = Math.acos(2 * Math.random() - 1);
      starPos[s * 3] = r * Math.sin(phi) * Math.cos(theta);
      starPos[s * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
      starPos[s * 3 + 2] = r * Math.cos(phi);
    }
    var starGeo = new THREE.BufferGeometry();
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.05 })));

    window.addEventListener('resize', function () {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    window.OrbitScene = {
      scene: scene, camera: camera, renderer: renderer,
      planet: planet, collectibles: collectibles, player: player,
      clock: new THREE.Clock()
    };
  })();
  </script>

  <!-- Input + physics -->
  <script>
  window.OrbitInput = { state: { keys: {}, score: 0, collected: new Set(), speed: 0.12, velocityX: 0, velocityZ: 0 } };
  (function () {
    var S = window.OrbitInput.state;
    function handleTouch(e) {
      e.preventDefault();
      S.keys = {};
      for (var t = 0; t < e.touches.length; t++) {
        var touch = e.touches[t];
        var x = touch.clientX / window.innerWidth;
        var y = touch.clientY / window.innerHeight;
        if (x < 0.5) S.keys['a'] = true; else S.keys['d'] = true;
        if (y < 0.5) S.keys['w'] = true; else S.keys['s'] = true;
      }
    }
    window.OrbitInput.init = function () {
      document.addEventListener('keydown', function (e) {
        S.keys[e.key] = true;
        if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].indexOf(e.key) !== -1) e.preventDefault();
      });
      document.addEventListener('keyup', function (e) { S.keys[e.key] = false; });
      document.addEventListener('touchstart', handleTouch, { passive: false });
      document.addEventListener('touchmove', handleTouch, { passive: false });
      document.addEventListener('touchend', function () { S.keys = {}; });
    };
    window.OrbitInput.update = function (delta) {
      var tx = 0, tz = 0;
      if (S.keys['ArrowLeft'] || S.keys['a']) tx = -S.speed;
      if (S.keys['ArrowRight'] || S.keys['d']) tx = S.speed;
      if (S.keys['ArrowUp'] || S.keys['w']) tz = -S.speed;
      if (S.keys['ArrowDown'] || S.keys['s']) tz = S.speed;
      S.velocityX += (tx - S.velocityX) * Math.min(1, delta * 8);
      S.velocityZ += (tz - S.velocityZ) * Math.min(1, delta * 8);
      var p = window.OrbitScene.player;
      p.position.x += S.velocityX * delta * 60;
      p.position.z += S.velocityZ * delta * 60;
      p.position.x = Math.max(-8, Math.min(8, p.position.x));
      p.position.z = Math.max(-8, Math.min(8, p.position.z));
    };
    window.OrbitInput.checkCollisions = function () {
      var p = window.OrbitScene.player;
      var list = window.OrbitScene.collectibles;
      for (var i = list.length - 1; i >= 0; i--) {
        if (S.collected.has(i)) continue;
        var c = list[i];
        if (Math.abs(p.position.x - c.position.x) < 0.6 &&
            Math.abs(p.position.z - c.position.z) < 0.6) {
          S.collected.add(i);
          S.score += 10;
          return i;
        }
      }
      return -1;
    };
  })();
  </script>

  <!-- Game loop -->
  <script>
  (function () {
    'use strict';
    var Sc = window.OrbitScene, In = window.OrbitInput, st = In.state;
    var TOTAL = Sc.collectibles.length;
    var time = 0, running = false;

    function loop() {
      if (!running) return;
      var delta = Math.min(Sc.clock.getDelta(), 0.05);
      time += delta;

      // orbit + bob uncollected collectibles
      for (var i = Sc.collectibles.length - 1; i >= 0; i--) {
        var c = Sc.collectibles[i];
        if (st.collected.has(i)) continue;
        var a = c.orbitSpeed * time + c.orbitOffset;
        c.position.x = Math.cos(a) * c.orbitRadius;
        c.position.z = Math.sin(a) * c.orbitRadius;
        c.position.y = Math.sin(time * c.bobSpeed) * c.bobAmount + c.baseY;
      }

      Sc.planet.rotation.y += 0.2 * delta;
      In.update(delta);

      var idx = In.checkCollisions();
      if (idx >= 0 && idx < Sc.collectibles.length) {
        var mesh = Sc.collectibles[idx];
        Sc.scene.remove(mesh);
        mesh.geometry.dispose();
        mesh.material.dispose();
        Sc.collectibles.splice(idx, 1);
      }

      document.getElementById('score-display').textContent = st.score;

      if (st.collected.size >= TOTAL) {
        running = false;
        document.getElementById('game-over').style.display = 'flex';
        document.getElementById('final-score').textContent = st.score;
      }

      Sc.renderer.render(Sc.scene, Sc.camera);
      requestAnimationFrame(loop);
    }

    window.OrbitGame = {
      init: function () {
        document.getElementById('start-btn').addEventListener('click', function () {
          document.getElementById('start-screen').style.display = 'none';
          In.init();
          Sc.clock.start();
          running = true;
          loop();
        });
        document.getElementById('restart-btn').addEventListener('click', function () {
          location.reload();
        });
      }
    };
  })();
  </script>

  <script>OrbitGame.init();</script>
</body>
</html>
