<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pocket Bumper</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="hud">
    <h1>Pocket Bumper</h1>
    <div class="stats">
      <span class="p1">P1 <b id="p1score">0</b></span>
      <span class="time" id="timer">90</span>
      <span class="p2">P2 <b id="p2score">0</b></span>
    </div>
  </div>
  <canvas id="game" width="720" height="520"></canvas>
  <div class="controls">
    <button class="tbtn" id="startBtn" type="button">&#9654; START</button>
  </div>
  <p class="hint">P1: WASD &middot; P2: Arrow keys &middot; Touch: drag each half of the screen &middot; Grab energy orbs, bump rivals, survive the shrinking walls! &middot; Restart: R</p>
</div>
<script src="script.js"></script>
</body>
</html>
