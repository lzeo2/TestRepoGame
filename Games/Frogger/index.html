<!DOCTYPE HTML>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Frogger</title>
  <link rel="stylesheet" href="base.css" type="text/css" />

<meta name="description" content="Frogger: Hop a frog across traffic and a rushing river to reach home safely.">
</head>
<body>
  <div id="hud">
    <h1>Frogger</h1>
    <p>Use the arrow keys to hop up, down, left and right. Reach the top before the time runs out while dodging cars and riding the logs. On touch, use the on-screen pad.</p>
  </div>
  <div id='container'>
    <canvas id='game' width='320' height='480'></canvas>
  </div>
  <div id="direction-pad" role="group" aria-label="Move the frog">
    <button type="button" data-direction="left" aria-label="Hop left">←</button>
    <button type="button" data-direction="up" aria-label="Hop up">↑</button>
    <button type="button" data-direction="down" aria-label="Hop down">↓</button>
    <button type="button" data-direction="right" aria-label="Hop right">→</button>
  </div>
  <script src='engine.js'></script>
  <script src='game.js'></script>
</body>
</html>
