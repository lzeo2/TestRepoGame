<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paddle Duel</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="hud">
    <h1>Paddle Duel</h1>
    <div class="stats">
      <span class="p1">P1 <b id="p1score">0</b></span>
      <span class="p2">P2 <b id="p2score">0</b></span>
    </div>
    <div id="modeLabel" class="mode-label"></div>
    <div id="activeEffects" class="active-effects"></div>
  </div>
  <canvas id="game" width="560" height="420"></canvas>
  <div id="modeSelect" class="mode-select">
    <button class="mode-btn" data-mode="classic" type="button">Classic</button>
    <button class="mode-btn" data-mode="chaos" type="button">Chaos</button>
    <button class="mode-btn" data-mode="mirror" type="button">Mirror</button>
  </div>
  <div class="controls">
    <div class="pad">
      <button class="tbtn" id="p1Up" type="button">W</button>
      <button class="tbtn" id="p1Down" type="button">S</button>
      <em>Player 1</em>
    </div>
    <div class="pad">
      <button class="tbtn" id="p2Up" type="button">&#9650;</button>
      <button class="tbtn" id="p2Down" type="button">&#9660;</button>
      <em>Player 2</em>
    </div>
  </div>
  <p class="hint">P1: W / S &middot; P2: &#9650; / &#9660; &middot; First to 5 wins &middot; SPACE to start</p>
</div>
<script src="script.js"></script>
</body>
</html>
