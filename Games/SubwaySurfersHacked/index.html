<!DOCTYPE html>
<html lang="en">
  <head>
    <!--
      Attribution / provenance:
      Fan-hosted HTML5 port (Unity WebGL build "SanFrancisco", v1.94.0, companyName
      "Kiloo Games") of Kiloo and SYBO Games' Subway Surfers, vendored from
      github.com/a456pur/seraph (branch main, commit ae2fcc6, path games/subwaysurfers).
      Google Analytics (gtag), the 4399 ad SDK, the Poki SDK (loader + core), and the
      tab-cloak script removed; a local no-op Poki stub answers the compiled
      _JS_PokiSDK_* glue, and an XHR/fetch hook routes Kiloo/SYBO backend hosts to a
      local json/null.json, so online services are inert offline. Social/website/store
      links remain user-initiated browser links only.
    -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Subway Surfers</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8F%83</text></svg>">
    <style>
      html { box-sizing: border-box; }
      *, *:before, *:after { box-sizing: inherit; }
      body {
        margin: 0;
        background: #231F20;
        overflow: hidden;
        font-family: Arial, Helvetica, sans-serif;
      }
      #gameContainer { width: 100vw; height: 100vh; }
      #gameContainer canvas {
        width: 100%;
        height: 100%;
        display: block;
      }

      #loader {
        position: absolute;
        left: 0;
        top: 0;
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #231F20;
        color: #fff;
        z-index: 10;
      }
      #loader h1 {
        font-size: 1.6em;
        letter-spacing: 0.04em;
        margin: 0 0 1.2em;
      }
      #loader p.controls {
        font-size: 0.8em;
        color: #bbb;
        margin: 1.5em 0 0;
        max-width: 80vw;
        text-align: center;
      }
      .spinner,
      .spinner:after {
        border-radius: 50%;
        width: 5em;
        height: 5em;
      }
      .spinner {
        margin: 10px;
        font-size: 10px;
        position: relative;
        text-indent: -9999em;
        border-top: 1.1em solid rgba(255, 255, 255, 0.2);
        border-right: 1.1em solid rgba(255, 255, 255, 0.2);
        border-bottom: 1.1em solid rgba(255, 255, 255, 0.2);
        border-left: 1.1em solid #ffffff;
        transform: translateZ(0);
        animation: spinner-spin 1.1s infinite linear;
      }
      @keyframes spinner-spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .progress {
        margin: 1.5em 0 0;
        border: 1px solid #fff;
        width: 50vw;
        max-width: 360px;
        display: none;
      }
      .progress .full {
        margin: 2px;
        background: #fff;
        height: 1em;
        width: 0%;
        transform-origin: top left;
      }
    </style>
    <script>
      // Offline-first guard: the compiled port embeds absolute URLs to Kiloo /
      // SYBO backend services (daily quests, auth, cloud saves, analytics,
      // purchase validation), Facebook/Google Sheets logging, Poki's site-lock
      // and a dev host. Route any such request to a local empty JSON so
      // nothing leaves this origin. In-game online features are inert offline.
      (function () {
        var external = /kiloo(-games)?\.com|sybogames|bladesofbrim|graph\.facebook\.com|script\.google\.com|azureedge\.net|poki\.com|10\.0\.0\.169/;

        var originalOpen = XMLHttpRequest.prototype.open;
        XMLHttpRequest.prototype.open = function (method, url) {
          if (typeof url === "string" && /^https?:\/\//i.test(url) && external.test(url)) {
            console.log("--fx--SubwaySurfers offline route--", url);
            url = "json/null.json?" + url;
          }
          return originalOpen.call(this, method, url);
        };

        if (window.fetch) {
          var originalFetch = window.fetch;
          window.fetch = function (input, init) {
            var url = typeof input === "string" ? input : (input && input.url) || "";
            if (/^https?:\/\//i.test(url) && external.test(url)) {
              console.log("--fx--SubwaySurfers offline fetch route--", url);
              return Promise.resolve(new Response("{}", { status: 200 }));
            }
            return originalFetch.call(this, input, init);
          };
        }
      })();
    </script>
  </head>

  <body>
    <!-- HACKED badge -->
    <div id="hackBadge" style="position:fixed;top:12px;right:12px;z-index:9999;background:#e63946;color:#fff;font-weight:700;font-size:14px;padding:6px 14px;border-radius:6px;letter-spacing:1px;font-family:sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.5);pointer-events:none;">HACKED</div>

    <script>
    /* ── Subway Surfers Hacked overrides ──────────────────────────
       Injected BEFORE the Unity loader so the Module config is
       already patched when UnityLoader.instantiate runs.
       ──────────────────────────────────────────────────────────── */
    (function () {
      // 1. Patch Unity Module — runs after WASM runtime init
      var _origModule = null;

      Object.defineProperty(window, '_hackModuleOverride', { value: true });

      var hackSetup = function (mod) {
        // Coins: intercept SendMessage calls targeting Score/Coins
        var _origSendMessage = null;
        if (typeof UnityLoader !== 'undefined' && UnityLoader.instantiate) {
          // post-load patching done below via gameInstance
        }
      };

      // 2. After game loads, patch the game instance for coins / invincibility
      var _patchInterval = setInterval(function () {
        if (typeof gameInstance === 'undefined' || !gameInstance) return;

        clearInterval(_patchInterval);

        // Override SendMessage to inject coin sets
        var gs = gameInstance.SendMessage;
        if (gs) {
          gameInstance.SendMessage = function (go, method, val) {
            // Intercept coin-related calls and amplify value
            if (method && /coin|score|collect/i.test(method)) {
              val = 999999;
            }
            return gs.call(this, go, method, val);
          };
        }

        // Periodically force-apply coin count so the display stays maxed
        var _coinTimer = setInterval(function () {
          try {
            if (gameInstance.SendMessage) {
              gameInstance.SendMessage('ScoreManager', 'SetCoins', 999999);
            }
          } catch (e) { /* Unity not ready yet */ }
        }, 2000);
        // Stop auto-patching after 60s (game should be well underway)
        setTimeout(function () { clearInterval(_coinTimer); }, 60000);

        // Invincibility: hook any crash/hit/death send-messages
        var _origSend2 = gameInstance.SendMessage;
        gameInstance.SendMessage = function (go, method, val) {
          if (/crash|hit|die|death|gameover|life|damage|obstacle/i.test(method)) {
            console.log('[HACK] blocked:', go, method);
            return; // swallow
          }
          return _origSend2.call(this, go, method, val);
        };

        console.log('%c[HACK] Subway Surfers Hacked — active', 'color:#e63946;font-weight:bold');
      }, 500);

    })();
    </script>

    <div id="gameContainer"></div>
    <div id="loader">
      <h1>Subway Surfers</h1>
      <div class="spinner"></div>
      <div class="progress"><div class="full"></div></div>
      <p class="controls">Steer, jump and roll — swipe/drag or arrow keys.</p>
    </div>

    <script src="js/poki-noop.js"></script>
    <script src="Build/UnityLoader.js"></script>
    <script>
      // The 4399-patched UnityLoader expects a global "my4399UnityModule"
      // module constructor. This build's own framework glue
      // (SanFrancisco.wasm.framework.unityweb) defines it under the plain name
      // window.UnityModule when UnityLoader evaluates it (top-level var in a
      // classic script). Resolve lazily so the name exists by the time
      // UnityLoader's framework job runs, without vendoring the 4399 SDK.
      Object.defineProperty(window, "my4399UnityModule", {
        configurable: true,
        get: function () { return window.UnityModule; }
      });

      var gameInstance = UnityLoader.instantiate("gameContainer", "Build/SanFrancisco/SanFrancisco.json", {
        onProgress: UnityProgress,
        Module: { onRuntimeInitialized: hideLoader }
      });
      window.unityGame = gameInstance;

      function UnityProgress(gameInstance, progress) {
        if (!gameInstance.Module) return;
        var loader = document.querySelector("#loader");
        var progressBox = loader.querySelector(".progress");
        var fill = progressBox.querySelector(".full");
        progressBox.style.display = "block";
        loader.querySelector(".spinner").style.display = "none";
        fill.style.width = (progress * 100) + "%";
      }

      function hideLoader() {
        var loader = document.querySelector("#loader");
        if (loader) loader.style.display = "none";
      }
    </script>
  </body>
</html>
