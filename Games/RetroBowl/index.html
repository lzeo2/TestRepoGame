
<html lang="en">
	<head>
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta http-equiv="pragma" content="no-cache" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"
		/>
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta charset="utf-8" />

		<title>Retro Bowl | Fan-hosted port</title>

		<style>
			body {
				background: #316afc;
				color: #cccccc;
				margin: 0px;
				padding: 0px;
				border: 0px;
			}
			canvas {
				image-rendering: optimizeSpeed;
				-webkit-interpolation-mode: nearest-neighbor;
				-ms-touch-action: none;
				margin: 0px;
				padding: 0px;
				border: 0px;
			}
			:-webkit-full-screen #canvas {
				width: 100%;
				height: 100%;
			}
			div.gm4html5_div_class {
				margin: 0px;
				padding: 0px;
				border: 0px;
			}
			/* START - Login Dialog Box */
			div.gm4html5_login {
				padding: 20px;
				position: absolute;
				border: solid 2px #000000;
				background-color: #316afc;
				color: #00ff00;
				border-radius: 15px;
				box-shadow: #101010 20px 20px 40px;
			}
			div.gm4html5_cancel_button {
				float: right;
			}
			div.gm4html5_login_button {
				float: left;
			}
			div.gm4html5_login_header {
				text-align: center;
			}
			/* END - Login Dialog Box */
			:-webkit-full-screen {
				width: 100%;
				height: 100%;
			}
		</style>
	</head>

	<body>
		<div class="gm4html5_div_class" id="gm4html5_div_id">
			<img
				src="html5game/splash.png"
				id="GM4HTML5_loadingscreen"
				alt="GameMaker:HTML5 loading screen"
				style="display: none"
			/>
			<canvas id="canvas" width="853" height="480">
				<p>Your browser doesn't support HTML5 canvas.</p>
			</canvas>
		</div>

		<script type="text/javascript" src="html5game/RetroBowl.js"></script>

		<script>
			// Local no-op Poki stub. The port's Poki glue (html5game/uph_poki.js) and
			// the compiled GameMaker code call into PokiSDK for ads/analytics. The
			// remote Poki SDK (and its poki.com/sitelock redirect) is replaced with
			// this local stub so those calls resolve inertly, fully offline.
			window.PokiSDK_OK = true;
			window.PokiSDK = {
				init: function () {
					return Promise.resolve();
				},
				gameLoadingStart: function () {},
				gameLoadingProgress: function () {},
				gameLoadingFinished: function () {},
				gameplayStart: function () {},
				gameplayStop: function () {},
				happyTime: function () {},
				commercialBreak: function () {
					return Promise.resolve(true);
				},
				rewardedBreak: function () {
					return Promise.resolve(false);
				}
			};
			window.addEventListener('load', function () {
				window.PokiSDK_loadState = 0;
				GameMaker_Init();
			});
		</script>
	</body>
</html>
