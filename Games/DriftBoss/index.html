<!DOCTYPE html>
<html lang="en">

<head>
	<title>Drift Boss | Seraph</title>
	<meta http-equiv="Content-type" content="text/html; charset=utf-8">
	<meta name="robots" content="noindex, nofollow">
	<meta name="viewport" content="width=device-width,height=device-height, initial-scale=1, maximum-scale=1, user-scalable=0, minimal-ui"/>
	<meta name="apple-mobile-web-app-capable" content="yes">
	<link rel="stylesheet" type="text/css" href="game.css">
	<script type="text/javascript" src="game.js"></script>
<meta name="description" content="Drift Boss: Steer right while holding, then release to steer left and stay on the winding track.">
</head>

<style>
  #controls-hint{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:10001;background:rgba(0,0,0,0.72);color:#fff;font-family:Arial,sans-serif;font-size:15px;line-height:1.5;text-align:center;padding:12px 24px;border-radius:10px;pointer-events:none;transition:opacity 0.5s}
  #controls-hint.hidden{opacity:0}
  #controls-hint-dismiss{pointer-events:auto;min-height:44px;margin-left:8px;padding:4px 8px;font:inherit;color:#fff;background:transparent;border:1px solid currentColor;border-radius:4px;cursor:pointer}
  #controls-hint-dismiss:focus-visible{outline:2px solid white;outline-offset:2px}
  /* no start-splash: the cover never covers the game */
  #play,#play-desktop{display:none!important;visibility:hidden!important;pointer-events:none!important}
</style>
<body onload="setTimeout(function(){window.scrollTo(0,1)},1);">

	<div id="ajaxbar">
		<div id="game"><canvas id="canvas"></canvas></div>
		<div id="webgl"><canvas id="webglcanvas"></canvas></div>
		<div id="orientate"><img src="media/graphics/orientate/landscape.jpg"></div>
		<div id="play" class="play"><img src="media/graphics/splash/mobile/cover-start.jpg" alt=""></div>
	</div>

	<div id="controls-hint">
	  Hold Space, the mouse button or your finger on the screen to steer right. Release to steer left.
	  <button type="button" id="controls-hint-dismiss" aria-label="Dismiss controls hint">Dismiss</button>
	</div>
	<script>
	(function(){
	  /* first interaction only unlocks audio; the game itself starts on load */
	  function unlock(){
	    try{ if(window.ig && ig.webaudio_ctx && ig.webaudio_ctx.state === 'suspended'){ ig.webaudio_ctx.resume(); } }catch(e){}
	  }
	  document.addEventListener('pointerdown', unlock, {once:true});
	  document.addEventListener('keydown', unlock, {once:true});
	  var el=document.getElementById('controls-hint');
	  var btn=document.getElementById('controls-hint-dismiss');
	  function dismiss(){el.classList.add('hidden');setTimeout(function(){el.style.display='none';},600);}
	  if(btn) btn.addEventListener('click',dismiss);
	  setTimeout(dismiss,12000);
	  document.addEventListener('keydown', function onDrive(event) {
    if (event.code !== 'Space' || event.target === btn) return;
    setTimeout(dismiss, 400);
    document.removeEventListener('keydown', onDrive);
  });
  document.getElementById('game').addEventListener('pointerdown', dismiss, {once:true});
	})();
	</script>

</body>

</html>
