
<html>

<head>

	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no" />
	<title>Doodle Jump | Seraph</title>

	<style>
		body {
			background-color: black;
			padding: 0px;
			margin: 0px;
		}

		#highscore {
			position: absolute;
			left: calc(-100px);
			Top: calc(-100px);
			width: 5px;
			display: 'none';
		}
		#controls-hint {
			position: fixed;
			bottom: 12px;
			left: 50%;
			transform: translateX(-50%);
			z-index: 9999;
			background: rgba(0,0,0,0.72);
			color: #fff;
			font-family: Arial, sans-serif;
			font-size: 14px;
			line-height: 1.5;
			text-align: center;
			padding: 10px 20px;
			border-radius: 8px;
			pointer-events: none;
			transition: opacity 0.5s;
		}
		#controls-hint.hidden { opacity: 0; }
	</style>
	<script type="text/javascript" src="./api.js"></script>
</head>

	<body>

	

	<script type="text/javascript">
	CloudAPI.init({
		'id': 229,
		'splash': true
	});
	CloudAPI.mute = function () {
	    if (Doodle && !Doodle.game.sound.mute) {
	        Doodle.game.sound.mute = true;
	        return true;
	    }

        return false;
    };

    CloudAPI.unmute = function () {
        if (Doodle && Doodle.game.sound.mute) {
            Doodle.game.sound.mute=false;
            return true;
        }

        return false;
    };
	</script>
		<input id="highscore" type="text" />
		<script type="text/javascript" src="js/phaser.min.js"></script>
		<script type="text/javascript" src="js/fulltilt.min.js"></script>
		<script type="text/javascript" src="js/build/production.min.js"></script> 
		<script type="text/javascript" src="js/NoSleep.min.js"></script>
		<script src="js/main.js"></script>  

		<div id="controls-hint">
		  <strong>Controls:</strong> Tilt device to move, or use <strong>&larr; &rarr;</strong> arrow keys.
		</div>

		<script> 
		var noSleep = new NoSleep();
		(function(){var el=document.getElementById('controls-hint');setTimeout(function(){el.classList.add('hidden');setTimeout(function(){el.style.display='none';},600);},10000);})();

function enableNoSleep() {
  noSleep.enable();
  document.removeEventListener('touchstart', enableNoSleep, false);
}


document.addEventListener('touchstart', enableNoSleep, false);


	</script>

	</body>
</html>
