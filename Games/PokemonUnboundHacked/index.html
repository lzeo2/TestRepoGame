<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokemonUnbound Hacked</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0a; overflow: hidden; }
        #game { width: 100vw; height: 100vh; }
        .hacked-badge {
            position: fixed; top: 10px; right: 10px; z-index: 9999;
            background: #ff0000; color: white; padding: 4px 12px;
            font-family: monospace; font-size: 11px;
            border-radius: 4px; pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="hacked-badge">HACKED</div>
    <div id="game"></div>
    <script>
        EJS_player = "#game";
        EJS_core = "gba";
        EJS_color = "#000000";
        EJS_startOnLoaded = true;
        EJS_pathtodata = "../_emulatorjs/data/";
        EJS_gameUrl = "pokemonunbound.zip";
        EJS_cheats = [
            ["Infinite Money", "82025838 423F"],
            ["Max Rare Candies", "82025840 03E7"],
            ["Infinite HP", "82025844 270F"],
            ["Walk Through Walls", "7881A409 E2026E0C"]
        ];
        
        // Auto-enable all cheats when emulator initializes
        // Override the EmulatorJS constructor to set checked=true
        const origPush = Array.prototype.push;
        let cheatsReady = false;
        
        // Hook into the emulator after it loads
        EJS_onGameStart = function() {
            console.log("[HACKED] Game started, enabling all cheats...");
            
            // Method 1: Directly enable via the emulator's cheat system
            if (window.EJS_emulator) {
                const emu = window.EJS_emulator;
                
                // Set all cheats as checked
                if (emu.cheats) {
                    emu.cheats.forEach((cheat, i) => {
                        cheat.checked = true;
                        if (emu.gameManager && emu.gameManager.setCheat) {
                            emu.gameManager.setCheat(i, true, cheat.code);
                        }
                    });
                    console.log("[HACKED] Enabled " + emu.cheats.length + " cheats");
                }
                
                // Also update the UI checkboxes
                const checkboxes = document.querySelectorAll('.ejs_cheat_row input[type="checkbox"]');
                checkboxes.forEach(cb => {
                    if (!cb.checked) {
                        cb.click();
                    }
                });
            }
            
            // Method 2: Re-apply every second to handle save loads
            setInterval(() => {
                if (window.EJS_emulator && window.EJS_emulator.gameManager) {
                    const emu = window.EJS_emulator;
                    emu.cheats.forEach((cheat, i) => {
                        if (emu.gameManager.setCheat) {
                            emu.gameManager.setCheat(i, true, cheat.code);
                        }
                    });
                }
            }, 1000);
        };
    </script>
    <script src="../_emulatorjs/data/loader.js"></script>
</body>
</html>
