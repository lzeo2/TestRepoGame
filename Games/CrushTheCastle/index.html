<html lang="en">
<head>
    <meta http-equiv="Content-Security-Policy" content="connect-src 'self'; img-src 'self' data: blob:">
    
    

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Crush the Castle | Seraph</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: black;
        }
    </style>
<meta name="description" content="Crush the Castle: Trebuchet physics siege. Demolish castles and their occupants.">
</head>
<body>
    <script src="../../storage/ruffle/ruffle.js"></script>

    <div id="ruffle" width="100%" height="100%"></div>
    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.addEventListener("load", (event) => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            const container = document.getElementById("ruffle");
            player.id = "player";
            player.style.width = "100%";
            player.style.height = "100%";
            container.appendChild(player);
            player.load({ url: "crush-the-castle-36145ed4.swf", allowNetworking: "none" });
        });
    </script>
</body>
</html>
