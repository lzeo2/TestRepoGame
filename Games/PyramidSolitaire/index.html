<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Pyramid Solitaire: remove cards that add up to 13." />
  <title>Pyramid Solitaire</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="bar">
    <span id="score">Score: 0</span>
    <button id="new-game" type="button">New Game</button>
  </header>
  <main id="board" tabindex="-1">
    <div id="pyramid"></div>
    <div class="piles">
      <button id="stock" type="button" aria-label="Draw card">Draw</button>
      <div id="waste" aria-label="Waste pile"></div>
    </div>
  </main>
  <p class="howto">Tap or click two exposed cards that add up to 13 (Kings go alone): stock plus waste counts too. Clear all 28 pyramid cards to win. Touch: tap cards. Keyboard: Tab to move, Enter or Space to pick, D to draw.</p>
  <div id="overlay" hidden>
    <div class="panel">
      <h2 id="overlay-title"></h2>
      <p id="overlay-score"></p>
      <button id="play-again" type="button">Play Again</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
