<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Hextris</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Hextris is a rotating hexagon puzzle game.">
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style/style.css">
  <script src="vendor/jquery.js"></script>
  <script src="vendor/jsonfn.min.js"></script>
  <script src="vendor/keypress.min.js"></script>
  <script src="js/save-state.js"></script>
  <script src="js/view.js"></script>
  <script src="js/wavegen.js"></script>
  <script src="js/math.js"></script>
  <script src="js/Block.js"></script>
  <script src="js/Hex.js"></script>
  <script src="js/Text.js"></script>
  <script src="js/comboTimer.js"></script>
  <script src="js/checking.js"></script>
  <script src="js/update.js"></script>
  <script src="js/render.js"></script>
  <script src="js/input.js"></script>
  <script src="js/main.js"></script>
  <script src="js/initialization.js"></script>
</head>
<body>
  <canvas id="canvas" aria-label="Hextris game board"></canvas>
  <div id="overlay" class="faded overlay" aria-live="polite"></div>
  <button id="startBtn" type="button">Start game</button>
  <div id="helpScreen" class="unselectable" aria-label="How to play">
    <div id="inst_main_body"></div>
  </div>
  <button id="openSideBar" class="helpText" type="button" aria-label="How to play">Help</button>
  <button id="pauseBtn" type="button" aria-label="Pause game">Pause</button>
  <button id="restartBtn" type="button" aria-label="Restart game">Restart</button>
  <div id="HIGHSCORE">HIGH SCORE</div>
  <div id="highScoreInGameText">
    <div id="highScoreInGameTextHeader">HIGH SCORE</div>
    <div id="currentHighScore">0</div>
  </div>
  <div id="gameoverscreen" aria-live="assertive">
    <div id="container">
      <div id="gameOverBox" class="GOTitle">GAME OVER</div>
      <div id="cScore">0</div>
      <div id="highScoresTitle" class="GOTitle">HIGH SCORES</div>
      <div class="score"><span class="scoreNum">1.</span> <span id="1place">0</span></div>
      <div class="score"><span class="scoreNum">2.</span> <span id="2place">0</span></div>
      <div class="score"><span class="scoreNum">3.</span> <span id="3place">0</span></div>
    </div>
    <div id="bottomContainer">
      <div id="buttonCont"><button id="restart" type="button">Restart</button></div>
    </div>
  </div>
</body>
</html>
