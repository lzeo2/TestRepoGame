<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Match</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="hud">
    <h1>Memory Match</h1>
    <div class="stats">
      <span>Moves <b id="moves">0</b></span>
      <span>Time <b id="time">0:00</b></span>
      <span>Pairs <b id="pairs">0/6</b></span>
      <span>Best <b id="best">--</b></span>
    </div>
  </div>

  <section id="screen-menu">
    <p class="tag">Flip cards two at a time and match every pair. Fewer moves and less time make a better score.</p>
    <div class="size-list">
      <button class="size-card" data-cards="12" type="button">
        <b>Small</b>
        <span>12 cards &middot; 6 pairs</span>
        <em id="best-12">Best: --</em>
      </button>
      <button class="size-card" data-cards="16" type="button">
        <b>Medium</b>
        <span>16 cards &middot; 8 pairs</span>
        <em id="best-16">Best: --</em>
      </button>
      <button class="size-card" data-cards="24" type="button">
        <b>Large</b>
        <span>24 cards &middot; 12 pairs</span>
        <em id="best-24">Best: --</em>
      </button>
    </div>
    <p class="hint">Click / tap a card size to begin.</p>
  </section>

  <section id="screen-game" class="hidden">
    <div id="board" class="board"></div>
    <p class="hint">Keyboard: arrows / WASD move &middot; SPACE or ENTER flips &middot; R restarts &middot; ESC quits</p>
  </section>
</div>

<div id="overlay" class="overlay hidden">
  <div class="panel" id="panel"></div>
</div>
<script src="script.js"></script>
</body>
</html>
