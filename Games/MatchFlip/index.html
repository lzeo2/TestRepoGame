<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Match Flip</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="hud">
    <h1>Match Flip</h1>
    <div class="stats">
      <span>Time <b id="time">0:00</b></span>
      <span>Moves <b id="moves">0</b></span>
      <span>Best <b id="best">--</b></span>
    </div>
  </div>
  <div id="board" class="board"></div>
  <p class="hint">Arrows / WASD to move &middot; SPACE to flip &middot; Touch: tap cards</p>
  <button id="resetBtn" class="reset" type="button">New Game</button>
</div>
<div id="overlay" class="overlay hidden">
  <div class="panel" id="panel"></div>
</div>
<script src="script.js"></script>
</body>
</html>
