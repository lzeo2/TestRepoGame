<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="../../assets/game-save.js">
function clearSave(){GameSave.clear('simonsays');document.getElementById('continue-btn').style.display='none'}
function saveState(){GameSave.save('simonsays',{bestLevel:typeof bestLevel!=='undefined'?bestLevel:0,bestScore:typeof bestScore!=='undefined'?bestScore:0})}
function checkSaved(){var s=GameSave.load('simonsays');if(s&&s._ts){bestLevel=s.bestLevel||0;bestScore=s.bestScore||0;document.getElementById('continue-btn').style.display='inline-block'}}
function continueGame(){startGame()}
var bestLevel=0,bestScore=0;
checkSaved();
</script>
<title>Simon Says</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111;color:#eee;font-family:system-ui,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh}
#start-screen,#over-screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#111;z-index:10}
#game-screen{display:none}
#over-screen{display:none;background:rgba(0,0,0,.85)}
h1{font-size:2.5em;margin-bottom:.3em;color:#d69e2e}
h2{font-size:1.8em;margin-bottom:.3em}
.info{font-size:1.1em;margin:.2em 0;color:#ccc}
button{padding:12px 28px;font-size:1.1em;border:none;border-radius:12px;background:#d69e2e;color:#111;cursor:pointer;margin-top:16px;font-weight:600}
button:hover{filter:brightness(1.15)}
.hud{text-align:center;font-size:1.3em;margin-bottom:20px}
.board{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:300px;height:300px}
.pad{border-radius:16px;cursor:pointer;transition:filter .15s,transform .1s;opacity:.7}
.pad.active{opacity:1;transform:scale(1.05);filter:brightness(1.3)}
.pad.g{background:#38a169}.pad.r{background:#e53e3e}.pad.b{background:#3182ce}.pad.y{background:#eab308}
.pad:active{transform:scale(.95)}
.controls-info{font-size:.85em;color:#888;margin-top:12px;text-align:center;max-width:300px;line-height:1.5}
.msg{margin-top:12px;font-size:1.1em;min-height:1.5em}
</style>
</head>
<body>
<div id="start-screen">
<h1>SIMON SAYS</h1>
<p class="info">Watch the pattern, then repeat it!</p>
<button onclick="startGame()">Start Game</button>
<button id="continue-btn" onclick="continueGame()" style="display:none;background:#38a169">Continue</button>
<div class="controls-info">Click the colored pads in the same order as the sequence. Keys 1-4 or J/K/L/; also work.</div>
</div>
<div id="game-screen" style="padding:20px">
<p class="hud">Level: <span id="level">1</span> | Score: <span id="score">0</span></p>
<div class="board" id="board"></div>
<p class="msg" id="msg">Watch carefully...</p>
<button onclick="startGame()" style="margin-top:16px">Restart</button>
</div>
<div id="over-screen">
<h2>Game Over</h2>
<p class="info">You reached level <span id="final-level">1</span></p>
<button onclick="startGame()">Play Again</button>
<button onclick="goHome()" style="background:#555">Main Menu</button>
<button onclick="clearSave()" style="background:#333;font-size:.85em;padding:8px 16px;margin-top:8px">Clear Save</button>
<button onclick="goHome()" style="background:#555">Main Menu</button>
</div>
<script>
let seq,playerSeq,score,level,playing,acceptInput;

function startGame(){
  seq=[];score=0;level=0;playing=true;acceptInput=false;
  document.getElementById('start-screen').style.display='none';
  document.getElementById('over-screen').style.display='none';
  document.getElementById('game-screen').style.display='block';
  render();
  nextRound();
}

function nextRound(){
  level++;playerSeq=[];
  document.getElementById('level').textContent=level;
  document.getElementById('msg').textContent='Watch carefully...';
  acceptInput=false;
  seq.push(Math.floor(Math.random()*4));
  playSequence();
}

function playSequence(){
  let i=0;
  let iv=setInterval(()=>{
    if(i>=seq.length){clearInterval(iv);acceptInput=true;document.getElementById('msg').textContent='Your turn!';return}
    highlight(seq[i]);
    i++;
  },600);
}

function highlight(idx){
  let pads=document.querySelectorAll('.pad');
  pads[idx].classList.add('active');
  setTimeout(()=>pads[idx].classList.remove('active'),400);
}

function playerClick(idx){
  if(!acceptInput||!playing)return;
  highlight(idx);
  playerSeq.push(idx);
  let i=playerSeq.length-1;
  if(playerSeq[i]!==seq[i]){
    gameOver();return;
  }
  if(playerSeq.length===seq.length){
    score+=level*10;
    document.getElementById('score').textContent=score;
    document.getElementById('msg').textContent='Correct!';
    acceptInput=false;
    setTimeout(nextRound,800);
  }
}

function gameOver(){
  playing=false;
  if(level>bestLevel){bestLevel=level;bestScore=score}saveState();
  document.getElementById('final-level').textContent=level;
  document.getElementById('game-screen').style.display='none';
  document.getElementById('over-screen').style.display='flex';
}

function goHome(){
  playing=false;
  document.getElementById('over-screen').style.display='none';
  document.getElementById('game-screen').style.display='none';
  document.getElementById('start-screen').style.display='flex';
}

function render(){
  let b=document.getElementById('board');b.innerHTML='';
  ['g','r','b','y'].forEach((c,i)=>{
    let d=document.createElement('div');
    d.className='pad '+c;
    d.onclick=()=>playerClick(i);
    b.appendChild(d);
  });
}

document.addEventListener('keydown',e=>{
  if(!acceptInput||!playing)return;
  const map={'1':0,'2':1,'3':2,'4':3,'j':0,'k':1,'l':2,';':3};
  if(map[e.key.toLowerCase()]!==undefined)playerClick(map[e.key.toLowerCase()]);
});
</script>
</body>
</html>
