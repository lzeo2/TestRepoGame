<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spelling Bee</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpolygon points='16,2 29,9 29,23 16,30 3,23 3,9' fill='%23ffd166'/%3E%3Ctext x='16' y='21' font-size='13' font-family='sans-serif' font-weight='bold' text-anchor='middle' fill='%23141a2a'%3ESB%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="hud">
    <h1>Spelling Bee</h1>
    <div class="stats">
      <span>Score <b id="score">0</b></span>
      <span>Words <b id="wCount">0/0</b></span>
    </div>
  </div>
  <p class="tagline">Make 4+ letter words. Every word must use the center letter.</p>
  <div class="rankwrap">
    <span id="rank" class="rank">Beginner</span>
    <div class="bar"><div id="rankBar" class="barfill"></div></div>
  </div>
  <div id="hive" class="hive"></div>
  <div id="current" class="current">&nbsp;</div>
  <p id="msg" class="msg">&nbsp;</p>
  <div id="words" class="words"></div>
  <div class="controls">
    <button id="delBtn" class="cbtn" type="button">&#9003; Delete</button>
    <button id="shuffleBtn" class="cbtn" type="button">Shuffle</button>
    <button id="submitBtn" class="cbtn primary" type="button">Submit</button>
    <button id="newBtn" class="cbtn" type="button">New Game</button>
  </div>
  <p class="hint">Tap letters or type A-Z &middot; Enter submits &middot; Backspace deletes &middot; Escape clears &middot; Space shuffles &middot; N new game</p>
</div>
<div id="overlay" class="overlay hidden">
  <div class="panel" id="panel"></div>
</div>
<script src="script.js"></script>
</body>
</html>
