<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hangman | UNBLOCKMATH</title>
<style>
:root{--bg:#111827;--panel:#1f2937;--ink:#f8fafc;--muted:#aab7ca;--accent:#fbbf24;--good:#34d399;--bad:#fb7185}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#273449,var(--bg) 60%);color:var(--ink);font:16px system-ui,sans-serif;display:grid;place-items:center;padding:20px}main{width:min(680px,100%);background:rgba(31,41,55,.94);border:1px solid #3d4b62;border-radius:24px;padding:clamp(20px,5vw,40px);box-shadow:0 20px 70px #0007}h1{text-align:center;color:var(--accent);letter-spacing:.12em;margin:0 0 8px;font-size:clamp(2rem,8vw,3.4rem)}h2{margin:.2em 0;color:var(--accent)}p{color:var(--muted);line-height:1.55}.screen{text-align:center}.hidden{display:none!important}.stats{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:22px 0 12px;color:var(--muted)}.stats strong{color:var(--ink)}.word{font-size:clamp(1.8rem,8vw,3.2rem);letter-spacing:.2em;min-height:70px;padding:16px 4px;color:#fff;overflow-wrap:anywhere}.hang{height:115px;position:relative;margin:0 auto 8px;max-width:170px;border-bottom:5px solid #94a3b8}.hang:before{content:"";position:absolute;left:30px;bottom:0;height:105px;border-left:5px solid #94a3b8}.hang:after{content:"";position:absolute;left:30px;top:8px;width:72px;border-top:5px solid #94a3b8}.hang span{position:absolute;border:4px solid var(--bad);border-radius:50%;width:28px;height:28px;left:88px;top:13px}.hang span:before,.hang span:after{content:"";position:absolute;left:10px;top:24px;height:45px;border-left:4px solid var(--bad)}.hang span:after{transform:rotate(35deg);transform-origin:top;left:0}.keyboard{display:grid;grid-template-columns:repeat(9,1fr);gap:7px;margin-top:18px}.keyboard button,.choice,button{min-height:44px;border:0;border-radius:10px;background:#334155;color:var(--ink);font:inherit;font-weight:700;cursor:pointer;transition:transform .12s,background .12s}.keyboard button{min-height:42px}.keyboard button:hover,.keyboard button:focus-visible,button:hover,button:focus-visible{background:#475569;outline:3px solid #fbbf2466;outline-offset:2px}.keyboard button:active,button:active{transform:scale(.95)}.keyboard button.used{opacity:.35;cursor:default}.keyboard button.correct{background:#087f5b}.keyboard button.wrong{background:#8c2945}.primary{background:var(--accent);color:#171717;padding:12px 28px;margin-top:16px}.primary:hover,.primary:focus-visible{background:#fcd34d}.result{font-size:1.15rem;margin:20px auto;max-width:470px}.tip{font-size:.9rem;margin-top:22px}
@media(max-width:470px){body{padding:10px}.keyboard{grid-template-columns:repeat(7,1fr);gap:5px}.keyboard button{font-size:.9rem}.word{letter-spacing:.12em}}
</style>
</head>
<body><main>
<section id="start" class="screen"><h1>HANGMAN</h1><p>Guess five secret words before the stick figure is complete. You get six misses per word.</p><p><strong>Controls:</strong> tap a letter or press A–Z on your keyboard.</p><button id="startBtn" class="primary">START GAME</button></section>
<section id="play" class="hidden"><div class="stats"><span>ROUND <strong id="round">1 / 5</strong></span><span>SCORE <strong id="score">0</strong></span><span>MISSES <strong id="misses">0 / 6</strong></span></div><div class="hang"><span id="head" class="hidden"></span></div><div id="word" class="word" aria-live="polite"></div><div id="keyboard" class="keyboard" aria-label="Letter keyboard"></div><p class="tip">Five rounds. Guess the word to move on.</p></section>
<section id="end" class="screen hidden"><h1 id="endTitle">NICE!</h1><p id="endText" class="result"></p><p>Final score: <strong id="finalScore"></strong></p><button id="againBtn" class="primary">PLAY AGAIN</button></section>
</main>
<script>
const words=['GALAXY','JUNGLE','PUZZLE','ROCKET','CASTLE','OCEAN','WIZARD','THUNDER','BUBBLE','VOLCANO'];
const screens={start:document.querySelector('#start'),play:document.querySelector('#play'),end:document.querySelector('#end')};
const $=id=>document.getElementById(id);let secret='',round=0,score=0,misses=0,used=new Set(),running=false;
function show(name){Object.values(screens).forEach(s=>s.classList.toggle('hidden',s!==screens[name]));}
function begin(){round=0;score=0;running=true;show('play');nextWord();}
function nextWord(){secret=words[Math.floor(Math.random()*words.length)];round++;misses=0;used=new Set();$('round').textContent=round+' / 5';$('score').textContent=score;$('misses').textContent='0 / 6';$('head').classList.add('hidden');drawWord();drawKeys();}
function drawWord(){ $('word').textContent=[...secret].map(c=>used.has(c)?c:'_').join(' '); }
function drawKeys(){const box=$('keyboard');box.replaceChildren();'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(letter=>{const b=document.createElement('button');b.type='button';b.textContent=letter;b.dataset.letter=letter;b.className=used.has(letter)?(secret.includes(letter)?'used correct':'used wrong'):'';b.disabled=used.has(letter);b.addEventListener('click',()=>guess(letter));box.append(b);});}
function guess(letter){if(!running||used.has(letter))return;used.add(letter);if(secret.includes(letter)){score+=10;drawWord();}else{misses++;$('misses').textContent=misses+' / 6';$('head').classList.remove('hidden');}drawKeys();if([...secret].every(c=>used.has(c)))setTimeout(()=>{score+=50;if(round===5)finish(true);else nextWord();},350);else if(misses>=6)setTimeout(()=>finish(false),350);}
function finish(won){running=false;$('endTitle').textContent=won?'WORD MASTER!':'GAME OVER';$('endText').textContent=won?'You solved every word. Excellent vocabulary!':'The word was '+secret+'. Keep practicing and try again.';$('finalScore').textContent=score;show('end');}
document.addEventListener('keydown',e=>{if(/^[a-z]$/i.test(e.key))guess(e.key.toUpperCase());if(e.key==='Enter'&&screens.start.classList.contains('hidden')===false)begin();});$('startBtn').addEventListener('click',begin);$('againBtn').addEventListener('click',begin);
</script></body></html>
