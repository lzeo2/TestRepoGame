<!DOCTYPE html>
<html lang="en">
  <head>
    <!--
      Attribution / provenance:
      Fan-hosted HTML5 port (Babylon.js, webpack bundle "temple_run_2_web") of
      the Temple Run 2 endless runner concept, vendored from
      github.com/deploythings123123123/seraph (branch main, commit ae2fcc6,
      path games/templerun2). Google Analytics (gtag), the site's tab-cloak
      script, the remote ico.ico favicon, and the Poki SDK (loader + core —
      an ad SDK that talks to poki.io/ad servers) are removed; a local no-op
      Poki stub answers the compiled PokiSDK glue, and an XHR/fetch hook routes
      any request to Poki, Babylon.js CDN, unpkg or typekit hosts to a local
      empty JSON, so nothing leaves this origin. The bundle's remaining
      external URL strings (reactjs.org warning links, assets.babylonjs.com
      environment defaults, use.typekit.net popup-window styling) are inert:
      the game loads its skybox, textures, audio and draco decoder from the
      local assets/ folder, and chunks load via the webpack automatic
      publicPath (relative to this file).
    -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Temple Run 2</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8F%9B%EF%B8%8F</text></svg>" />
    <link rel="stylesheet" type="text/css" href="global.css" />

    <style>
      html,
      body {
        overflow: hidden;
        width: 100%;
        height: 100%;
        min-height: 100%;
        max-height: 100%;
        position: absolute;
        top: 0;
        left: 0;
        margin: 0;
        padding: 0;
        -webkit-text-size-adjust: none;
        touch-action: pan-x pan-y;
      }

      #loader {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0b0a12;
        color: #fff;
        font-family: system-ui, "Segoe UI", Roboto, sans-serif;
        z-index: 100;
        text-align: center;
        padding: 16px;
        box-sizing: border-box;
      }
      #loader h1 {
        font-family: temple-run-small-caps, Arial, Helvetica, sans-serif;
        font-size: 1.8em;
        letter-spacing: 0.04em;
        margin: 0 0 0.6em;
      }
      #loader p.controls {
        font-size: 0.8em;
        color: #bbb;
        margin: 0;
        max-width: 80vw;
      }
      .spinner,
      .spinner:after {
        border-radius: 50%;
        width: 4em;
        height: 4em;
      }
      .spinner {
        margin: 0 0 1.2em;
        font-size: 10px;
        position: relative;
        text-indent: -9999em;
        border-top: 0.9em solid rgba(255, 255, 255, 0.2);
        border-right: 0.9em solid rgba(255, 255, 255, 0.2);
        border-bottom: 0.9em solid rgba(255, 255, 255, 0.2);
        border-left: 0.9em solid #ffffff;
        transform: translateZ(0);
        animation: spinner-spin 1.1s infinite linear;
      }
      @keyframes spinner-spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>

    <script>
      // Offline-first guard: the compiled bundle embeds URLs to Poki's ad
      // network, Babylon.js CDN fallbacks, unpkg and the typekit popup-font
      // kit. Route any such request to a local empty JSON so nothing leaves
      // this origin. Gameplay assets (skybox, textures, audio, draco decoder,
      // webpack chunks) all load from local paths and are unaffected.
      (function () {
        var external = /poki\.com|babylonjs\.com|unpkg\.com|typekit\.net|googletagmanager\.com|google-analytics\.com/;

        var originalOpen = XMLHttpRequest.prototype.open;
        XMLHttpRequest.prototype.open = function (method, url) {
          if (typeof url === "string" && /^https?:\/\//i.test(url) && external.test(url)) {
            console.log("--fx--TempleRun2 offline route--", url);
            url = "json/null.json?" + url;
          }
          return originalOpen.call(this, method, url);
        };

        if (window.fetch) {
          var originalFetch = window.fetch;
          window.fetch = function (input, init) {
            var url = typeof input === "string" ? input : (input && input.url) || "";
            if (/^https?:\/\//i.test(url) && external.test(url)) {
              console.log("--fx--TempleRun2 offline fetch route--", url);
              return Promise.resolve(new Response("{}", { status: 200 }));
            }
            return originalFetch.call(this, input, init);
          };
        }
      })();
    </script>
  </head>
  <body>
    <div id="loader">
      <div class="spinner"></div>
      <h1>Temple Run 2</h1>
      <p class="controls">Swipe / drag to turn, jump and slide · arrow keys on desktop</p>
    </div>

    <script src="poki-noop.js"></script>
    <script defer src="bundle_original.js"></script>
    <script>
      // The compiled game appends its canvas and UI to <body> once booted;
      // drop the loader when it reports the first frame (PokiSDK boot gate).
      window.addEventListener("load", function () {
        var tries = 0;
        var timer = setInterval(function () {
          if (document.querySelector("canvas") || tries++ > 120) {
            clearInterval(timer);
            var loader = document.querySelector("#loader");
            if (loader) loader.style.display = "none";
          }
        }, 250);
      });
    </script>
  </body>
</html>
