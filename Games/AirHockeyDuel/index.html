<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Air Hockey Duel</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="game-container">

  <div id="start-screen">
    <h1>AIR HOCKEY DUEL</h1>

    <div class="setting-group">
      <label id="lbl-speed">Puck Speed</label>
      <div class="btn-group" id="speed-btns" role="radiogroup" aria-labelledby="lbl-speed">
        <button type="button" data-val="slow" role="radio" aria-checked="false">Slow</button>
        <button type="button" data-val="normal" role="radio" aria-checked="true" class="active">Normal</button>
        <button type="button" data-val="fast" role="radio" aria-checked="false">Fast</button>
      </div>
    </div>

    <div class="setting-group">
      <label id="lbl-goal">Goal Size</label>
      <div class="btn-group" id="goal-btns" role="radiogroup" aria-labelledby="lbl-goal">
        <button type="button" data-val="normal" role="radio" aria-checked="true" class="active">Normal</button>
        <button type="button" data-val="wide" role="radio" aria-checked="false">Wide</button>
      </div>
    </div>

    <div class="setting-group">
      <label id="lbl-mode">Mode</label>
      <div class="btn-group" id="mode-btns" role="radiogroup" aria-labelledby="lbl-mode">
        <button type="button" data-val="2p" role="radio" aria-checked="true" class="active">2 Player</button>
        <button type="button" data-val="ai" role="radio" aria-checked="false">vs AI</button>
      </div>
    </div>

    <div class="setting-group" id="ai-difficulty-group" style="display:none">
      <label id="lbl-diff">AI Difficulty</label>
      <div class="btn-group" id="diff-btns" role="radiogroup" aria-labelledby="lbl-diff">
        <button type="button" data-val="easy" role="radio" aria-checked="false">Easy</button>
        <button type="button" data-val="normal" role="radio" aria-checked="true" class="active">Normal</button>
        <button type="button" data-val="hard" role="radio" aria-checked="false">Hard</button>
      </div>
    </div>

    <button type="button" id="startBtn" class="primary-btn">START</button>

    <p class="controls-info">P1: W A S D &nbsp;|&nbsp; P2: Arrow Keys</p>
    <p class="controls-info">Press SPACE to start or restart</p>
    <p class="key-note">If a key sticks, tap it again</p>
  </div>

  <div id="hud" style="display:none" aria-live="polite">
    <span class="hud-label hud-p1">P1</span>
    <span id="score-p1" class="hud-score score-cyan" aria-label="Player 1 score">0</span>
    <span class="hud-sep">-</span>
    <span id="score-p2" class="hud-score score-amber" aria-label="Player 2 score">0</span>
    <span class="hud-label hud-p2">P2</span>
    <span id="timer" class="hud-timer" aria-label="Match time">0:00</span>
  </div>

  <canvas id="rink" width="400" height="600"></canvas>

  <div id="touch-controls" style="display:none">
    <div id="touch-p1" class="touch-cluster">
      <button type="button" class="touch-btn" data-player="p1" data-dir="up" aria-label="Player 1 up">&#x25B2;</button>
      <button type="button" class="touch-btn" data-player="p1" data-dir="left" aria-label="Player 1 left">&#x25C0;</button>
      <button type="button" class="touch-btn" data-player="p1" data-dir="right" aria-label="Player 1 right">&#x25B6;</button>
      <button type="button" class="touch-btn" data-player="p1" data-dir="down" aria-label="Player 1 down">&#x25BC;</button>
    </div>
    <div id="touch-p2" class="touch-cluster">
      <button type="button" class="touch-btn" data-player="p2" data-dir="up" aria-label="Player 2 up">&#x25B2;</button>
      <button type="button" class="touch-btn" data-player="p2" data-dir="left" aria-label="Player 2 left">&#x25C0;</button>
      <button type="button" class="touch-btn" data-player="p2" data-dir="right" aria-label="Player 2 right">&#x25B6;</button>
      <button type="button" class="touch-btn" data-player="p2" data-dir="down" aria-label="Player 2 down">&#x25BC;</button>
    </div>
  </div>

  <div id="win-screen" style="display:none">
    <h2 id="win-title"></h2>
    <div id="win-stats"></div>
    <button type="button" id="restartBtn" class="primary-btn">RESTART</button>
    <button type="button" id="menuBtn" class="primary-btn">MENU</button>
  </div>

</div>
<script src="script.js"></script>
</body>
</html>
