<!doctype html>
<html lang="en-AU" data-theme="dark" style="background:#181c1b;color-scheme:dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="CITISTEN. Build a town in free build or defend its town hall at night. Offline solo city building.">
  <title>CITISTEN</title>
  <link rel="icon" href="../../favicon.svg">
  <link rel="stylesheet" href="./ui.css">
  <link rel="stylesheet" href="./native.css">
</head>
<body>
  <canvas id="world" tabindex="0" aria-label="Town. Click to build; drag for roads. WASD moves, right drag rotates, wheel changes height."></canvas>
  <div id="ui" class="citisten-ui" data-theme="dark"></div>
  <section id="native-controls" hidden aria-label="Game controls">
    <label>Speed <select id="speed"><option value="0">Paused</option><option value="1" selected>1x</option><option value="3">3x</option><option value="10">10x</option></select></label>
    <button id="repair" type="button">Repair lot</button>
    <details><summary>Controls</summary><p>Click or tap to build. Drag roads ($10/lot). 1 road; 2/3/4 zones; 5/6 utilities; 7/8/9 services; B wall; N tower; X remove. Zones need roads. Connect power and water by road. Menu pauses. Build by day; defend the hall at night.</p>
      <div id="camera-pad" aria-label="Touch camera">
        <button data-camera="forward" aria-label="Move forward">↑</button><button data-camera="back" aria-label="Move backward">↓</button><button data-camera="left" aria-label="Move left">←</button><button data-camera="right" aria-label="Move right">→</button><button data-camera="up" aria-label="Raise camera">+</button><button data-camera="down" aria-label="Lower camera">−</button><button data-camera="turn" aria-label="Rotate camera">Rotate</button>
      </div>
    </details>
    <p id="feedback" role="status" aria-live="polite">Loading town models…</p>
  </section>
  <p id="loading" role="status">Loading town models…</p>
  <script type="module" src="./native.mjs"></script>
</body>
</html>
