<!DOCTYPE html>
<html lang="en">

<head>
    <title>Chess | Seraph</title>
    <link rel="shortcut icon" href="../../images/ico.ico">
    <script src="../../storage/js/cloak.js"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="lib/chessboardjs/css/chessboard-0.3.0.css">
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <div id="container">
        <div id="header"><img src="./img/chesspieces/chess.png" alt="Chess"></div>
        <div class="controls-row">
            <div class="controls-doc" aria-label="How to play">
                <strong>How to play:</strong> Click (or tap) a white piece to select it, then click the destination square.
                You play White; the AI plays Black. After your move, the AI responds automatically.
                Hover over a piece to see legal moves highlighted.
            </div>
            <div id="game-status" class="game-status" role="status" aria-live="polite"></div>
            <button id="new-game-btn" type="button" aria-label="Start a new game">New Game</button>
        </div>
        <div id="board" class="board"></div>
        <div class="info">
            <p>Search depth:
                <select id="search-depth" aria-label="AI search depth">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3" selected>3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>
            </p>
            <br>
            <div class="subsection">
                <span>Positions evaluated: <span id="position-count"></span></span>
            </div>
            <br>
            <div class="subsection">
                <span>Time: <span id="time"></span></span>
            </div>
            <br>
            <div class="subsection">
                <span>Positions/s: <span id="positions-per-s"></span> </span>
            </div>
            <br>
            <br>
            <div id="move-history" class="move-history">
            </div>
        </div>
    </div>
    <script src="lib/jquery/jquery-3.2.1.min.js"></script>
    <script src="lib/chessboardjs/js/chess.js"></script>
    <script src="lib/chessboardjs/js/chessboard-0.3.0.js"></script>
    <script src="script.js"></script>
    <script>

    </script>
</body>

</html>
