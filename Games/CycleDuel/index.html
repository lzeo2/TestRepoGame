<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cycle Duel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="hud" id="hud" hidden>
      <div class="score"><span class="p1">P1</span> <span id="scoreVal">0 - 0</span> <span class="p2">P2</span></div>
      <div class="timer" id="timerVal">0:00</div>
    </header>

    <main class="stage">
      <section class="screen start" id="startScreen">
        <h1>Cycle Duel</h1>
        <p class="tagline">Two riders. One keyboard. First to 5 rounds wins.</p>

        <div class="options">
          <div class="option-row">
            <span>Speed</span>
            <div class="segment" id="speedSeg">
              <button data-val="slow">Slow</button>
              <button data-val="normal" class="active">Normal</button>
              <button data-val="fast">Fast</button>
            </div>
          </div>
          <div class="option-row">
            <span>Obstacles</span>
            <div class="segment" id="obsSeg">
              <button data-val="false" class="active">Off</button>
              <button data-val="true">On</button>
            </div>
          </div>
          <div class="option-row">
            <span>Mode</span>
            <div class="segment" id="modeSeg">
              <button data-val="2p" class="active">2P</button>
              <button data-val="ai">vs AI</button>
            </div>
          </div>
          <div class="option-row" id="diffRow" hidden>
            <span>Difficulty</span>
            <div class="segment" id="diffSeg">
              <button data-val="easy">Easy</button>
              <button data-val="normal" class="active">Normal</button>
              <button data-val="hard">Hard</button>
            </div>
          </div>
        </div>

        <div class="controls">
          <div><span class="swatch p1"></span> P1 <b>WASD</b></div>
          <div><span class="swatch p2"></span> P2 <b>Arrow keys</b></div>
        </div>

        <p class="note" id="touchNote" hidden>Touch control works in 1P vs AI mode. Two-player needs a keyboard.</p>
        <p class="note">If a key sticks, tap it again.</p>
        <button class="primary" id="startBtn">Start Round</button>
      </section>

      <section class="screen overlay" id="roundScreen" hidden>
        <h2 id="roundTitle">Round Over</h2>
        <p id="roundDetail"></p>
        <button class="primary" id="nextRoundBtn">Next Round</button>
      </section>

      <section class="screen overlay" id="winScreen" hidden>
        <h2 id="winTitle">Match Winner</h2>
        <p id="winDetail"></p>
        <div class="btn-row">
          <button class="primary" id="restartBtn">Restart</button>
          <button class="secondary" id="menuBtn">Menu</button>
        </div>
      </section>

      <canvas id="game" width="720" height="496"></canvas>
    </main>

    <footer class="touch" id="touchControls" hidden>
      <p>Tap to turn the cyan rider</p>
      <div class="pad">
        <button data-dir="up">W</button>
        <button data-dir="left">A</button>
        <button data-dir="down">S</button>
        <button data-dir="right">D</button>
      </div>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
