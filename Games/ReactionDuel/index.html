<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reaction Duel</title>
  <link rel="stylesheet" href="style.css">
  <script src="../../assets/game-save.js"></script>
</head>
<body>
  <div id="app">
    <!-- MENU SCREEN -->
    <div id="screen-menu" class="screen active">
      <h1 class="title">REACTION DUEL</h1>
      <p class="subtitle">Test your reflexes head-to-head</p>
      <div class="mode-select">
        <button class="mode-btn selected" data-mode="duel">2P Duel</button>
        <button class="mode-btn" data-mode="solo">Solo Test</button>
        <button class="mode-btn" data-mode="tricky">Tricky Duel</button>
      </div>
      <div id="controls-info" class="controls-info">
        <p><span class="p1-label">P1</span> press <kbd>A</kbd></p>
        <p><span class="p2-label">P2</span> press <kbd>L</kbd></p>
        <p class="controls-note">First to 5 rounds wins</p>
      </div>
      <button id="startBtn" class="start-btn">START</button>
    </div>

    <!-- PLAY SCREEN -->
    <div id="screen-play" class="screen">
      <div id="scoreboard" class="scoreboard">
        <span class="p1-label">P1: <span id="score-p1">0</span></span>
        <span class="round-info">Round <span id="round-num">1</span></span>
        <span class="p2-label">P2: <span id="score-p2">0</span></span>
      </div>
      <div id="play-area" class="play-area">
        <div id="stage-text" class="stage-text"></div>
        <div id="stage-sub" class="stage-sub"></div>
      </div>
      <div id="touch-zones" class="touch-zones">
        <button class="touch-zone touch-p1" data-player="1">P1</button>
        <button class="touch-zone touch-p2" data-player="2">P2</button>
      </div>
    </div>

    <!-- ROUND RESULT OVERLAY -->
    <div id="screen-result" class="screen">
      <div id="result-text" class="result-text"></div>
      <div id="result-detail" class="result-detail"></div>
    </div>

    <!-- WIN SCREEN -->
    <div id="screen-win" class="screen">
      <h2 id="win-title" class="win-title"></h2>
      <div id="win-stats" class="win-stats"></div>
      <div id="round-history" class="round-history"></div>
      <div class="win-buttons">
        <button id="restartBtn" class="action-btn">Restart</button>
        <button id="menuBtn" class="action-btn">Menu</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
