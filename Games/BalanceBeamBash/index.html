<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Balance Beam Bash</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="hud">
    <div class="player left">
      <span class="who">P1</span>
      <b id="p1score">0</b>
      <small>best <b id="p1best">0</b></small>
    </div>
    <div class="clock">
      <b id="timer">60</b>
      <small>seconds</small>
    </div>
    <div class="player right">
      <span class="who">P2</span>
      <b id="p2score">0</b>
      <small>best <b id="p2best">0</b></small>
    </div>
  </div>
  <canvas id="game" width="720" height="480"></canvas>
  <div class="controls">
    <div class="pad">
      <button class="tbtn p1" id="p1W" type="button">TIP LEFT</button>
      <button class="tbtn p1" id="p1L" type="button">LAUNCH</button>
      <em>P1</em>
    </div>
    <div class="mid">
      <button class="tbtn small" id="restartBtn" type="button">&#8635;</button>
      <button class="tbtn small" id="muteBtn" type="button">&#128266;</button>
    </div>
    <div class="pad">
      <button class="tbtn p2" id="p2W" type="button">TIP RIGHT</button>
      <button class="tbtn p2" id="p2L" type="button">LAUNCH</button>
      <em>P2</em>
    </div>
  </div>
  <p class="hint">P1: A = tip left &middot; S = launch &middot; P2: L = tip right &middot; K = launch &middot; hold launch to charge, release to fire &middot; SPACE start &middot; R restart &middot; M mute</p>
</div>
<script src="script.js"></script>
</body>
</html>
