</head><body><main id="shell"><canvas id="game" width="960" height="600" aria-label="Night Shift game"></canvas><div class="touch"><button class="pad" id="move" aria-label="Move"></button><button class="pad aim" id="aim" aria-label="Aim and fire"></button><div class="tog"><button id="run">RUN</button><button id="sneak">SNEAK</button></div><div class="act"><button id="fire">FIRE</button><button id="flare">FLARE</button><button id="use">USE</button><button id="reload">RELOAD</button></div></div><div id="panel"><section><h1>NIGHT SHIFT</h1><p id="copy">Enter from the south. Take the data case from the terminal, then reach the north gate. Light and sound bring guards running.</p><div class="buttons"><button id="play">PLAY</button><button id="how">HOW TO PLAY</button><button id="about">ABOUT</button></div></section></div></main><script>
(()=>{const C=document.getElementById('game'),X=C.getContext('2d'),panel=document.getElementById('panel'),copy=document.getElementById('copy');let screen='TITLE',tick=0,score=0,best=0,seed=22701,renderer='canvas2d',held={},pressed={},touch={mx:0,my:0,ax:0,ay:0,move:false,aim:false},p,guards,bullets,rings,lamps,caseTaken=false,extract=0,interact=0,ammo=5,reserve=15,lives=3,alarm=0,flare=3,time=150,simTick=0,acc=0,last=0,paused=false;try{best=+(localStorage.getItem('night-shift.best')||0)}catch(e){}
function chooseRenderer(){if(location.search.includes('renderer=canvas'))return;try{let q=document.createElement('canvas').getContext('webgl',{antialias:false,alpha:false});if(q){let vs=q.createShader(q.VERTEX_SHADER);q.shaderSource(vs,'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}');q.compileShader(vs);if(q.getShaderParameter(vs,q.COMPILE_STATUS))renderer='webgl1'}}catch(e){renderer='canvas2d'}}chooseRenderer();
const walls=[];for(let i=0;i<24;i++)walls.push({x:160+(i%6)*360,y:170+Math.floor(i/6)*270,w:220,h:24});
function reset(){screen='TITLE';tick=0;score=0;caseTaken=false;extract=0;interact=0;ammo=5;reserve=15;lives=3;alarm=0;flare=3;time=150;simTick=0;bullets=[];rings=[];p={x:1200,y:1370,vx:0,vy:0,aim:0,inv:0,fire:0,reload:0,run:0,sneak:0,shot:0};guards=[0,1,2,3].map((i)=>({x:[420,1210,1980,2040][i],y:[300,740,380,1200][i],a:0,dead:false,pat:i}));lamps=[...Array(6)].map((_,i)=>({x:350+(i%3)*850,y:250+Math.floor(i/3)*900,on:true}));}
function startTest(s){seed=s||22701;reset();screen='PLAYING'}reset();
function down(k){held[k]=1;pressed[k]=1}addEventListener('keydown',e=>{down(e.key);if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','Shift','c','e','f','r','j','p'].includes(e.key))e.preventDefault();if(e.key==='Escape'||e.key==='p')togglePause()});addEventListener('keyup',e=>delete held[e.key]);addEventListener('blur',clear);document.addEventListener('visibilitychange',()=>{clear();if(document.hidden)paused=true});function clear(){held={};touch.move=touch.aim=false}
function togglePause(){if(screen==='PLAYING'){paused=!paused;screen=paused?'PAUSED':'PLAYING';panel.classList.toggle('hidden',!paused);copy.textContent=paused?'Simulation paused. Resume when ready.':'Enter from the south. Take the data case from the terminal, then reach the north gate.'}}
function act(k){held[k]=1;setTimeout(()=>delete held[k],100)}['fire','flare','use','reload'].forEach(id=>document.getElementById(id).onpointerdown=()=>act(id));document.getElementById('run').onpointerdown=()=>held.Shift=1;document.getElementById('sneak').onpointerdown=()=>held.c=1;for(const id of ['run','sneak'])document.getElementById(id).onpointerup=()=>delete held[id];
function pad(el,key){el.onpointerdown=e=>{el.setPointerCapture(e.pointerId);touch[key]=true;touch[key+'x']=e.clientX;touch[key+'y']=e.clientY};el.onpointermove=e=>{if(touch[key]){touch[key+'x']=e.clientX;touch[key+'y']=e.clientY}};el.onpointerup=el.onpointercancel=()=>touch[key]=false}pad(document.getElementById('move'),'move');pad(document.getElementById('aim'),'aim');
play.onclick=()=>{screen='HOWTO';panel.classList.remove('hidden');copy.textContent='WASD or arrows move. Shift runs, C sneaks, click or J fires, F throws a flare, E uses the terminal or gate, R reloads. Touch controls stay inside the shell.';play.textContent='START';play.onclick=()=>{startTest(22701);panel.classList.add('hidden')}};how.onclick=()=>{screen='HOWTO';copy.textContent='Move quietly, shoot lamps to darken them, and listen for guard reactions. P or Escape pauses.'};about.onclick=()=>{copy.textContent='Original implementation, inspired by game concepts; not affiliated with Anomaly.'};
function noise(x,y,r){if(rings.length<4)rings.push({x,y,r,t:0})}function shoot(){if(p.fire>0||p.reload>0)return;if(ammo<=0){reload();return}ammo--;p.fire=.45;p.shot=1.2;noise(p.x,p.y,180);bullets.length<8&&bullets.push({x:p.x,y:p.y,a:p.aim,t:.8})}function reload(){if(p.reload<=0&&ammo<5&&reserve>0){p.reload=1.4;noise(p.x,p.y,100)}}
function sim(dt){simTick++;tick++;time=Math.max(0,time-dt);p.inv=Math.max(0,p.inv-dt);p.fire=Math.max(0,p.fire-dt);p.reload=Math.max(0,p.reload-dt);p.shot=Math.max(0,p.shot-dt);if(p.reload===0&&ammo<5&&reserve>0&&pressed.reload){let n=Math.min(5-ammo,reserve);ammo+=n;reserve-=n}let dx=(held.ArrowRight||held.d?1:0)-(held.ArrowLeft||held.a?1:0),dy=(held.ArrowDown||held.s?1:0)-(held.ArrowUp||held.w?1:0);if(touch.move){dx=touch.movex?Math.sign(touch.movex-(C.getBoundingClientRect().left+80)):0;dy=touch.movey?Math.sign(touch.movey-(C.getBoundingClientRect().top+80)):0}let len=Math.hypot(dx,dy)||1,spd=held.c||touch.sneak?72:held.Shift||touch.run?210:130; p.vx+=(dx/len*spd-p.vx)*Math.min(1,900*dt);p.vy+=(dy/len*spd-p.vy)*Math.min(1,900*dt);if(!dx&&!dy){p.vx*=Math.max(0,1-1100*dt/Math.max(1,Math.abs(p.vx)+Math.abs(p.vy)));p.vy*=Math.max(0,1-1100*dt/Math.max(1,Math.abs(p.vx)+Math.abs(p.vy)))}p.x=Math.max(30,Math.min(2370,p.x+p.vx*dt));p.y=Math.max(30,Math.min(1470,p.y+p.vy*dt));if(Math.hypot(p.vx,p.vy)>170&&tick%10===0)noise(p.x,p.y,130);if(pressed.j||pressed.fire)shoot();if(pressed.r||pressed.reload)reload();if(pressed.f||pressed.flare){if(flare>0){flare--;noise(p.x,p.y,70)}}if(pressed.e||pressed.use){if(Math.hypot(p.x-1200,p.y-740)<42&&!caseTaken)interact+=dt;else if(Math.hypot(p.x-1200,p.y-90)<42&&caseTaken)extract+=dt;else{interact=0;extract=0}}else{interact=0;extract=0}if(interact>=1.5){caseTaken=true;interact=0;noise(p.x,p.y,100)}if(extract>=1){finish(true);return}for(const b of bullets){b.x+=Math.cos(b.a)*620*dt;b.y+=Math.sin(b.a)*620*dt;b.t-=dt;for(const g of guards)if(!g.dead&&Math.hypot(b.x-g.x,b.y-g.y)<20){g.dead=true;score+=100}}bullets=bullets.filter(b=>b.t>0);for(const r of rings)r.t+=dt;rings=rings.filter(r=>r.t<1.1);for(const g of guards)if(!g.dead){let d=Math.hypot(p.x-g.x,p.y-g.y);if(d<300&&(p.shot>0||Math.hypot(p.vx,p.vy)>170)){g.a=Math.atan2(p.y-g.y,p.x-g.x);g.x+=Math.cos(g.a)*55*dt;g.y+=Math.sin(g.a)*55*dt;if(d<30&&p.inv<=0){lives--;p.inv=1;if(lives<=0)finish(false)}}else{g.x+=Math.cos(tick*.01+g.pat)*35*dt;g.y+=Math.sin(tick*.013+g.pat)*35*dt}}if(time<=0)finish(false);pressed={}}
function finish(win){screen='RESULT';score=Math.max(0,Math.round((win?1000:0)+time*10+lamps.filter(l=>l.on).length*150-(3-lives)*100-(5-ammo)*0));if(score>best){best=score;try{localStorage.setItem('night-shift.best',best)}catch(e){}}panel.classList.remove('hidden');copy.textContent=(win?'EXTRACTION COMPLETE. ':'ROUND LOST. ')+'Score '+score+' | Best '+best+'.';play.textContent='RESTART';play.onclick=()=>{startTest(22701);panel.classList.add('hidden')}}
function render(){X.clearRect(0,0,960,600);let cx=Math.max(0,Math.min(1440,p.x-480)),cy=Math.max(0,Math.min(900,p.y-300));X.save();X.translate(-cx,-cy);X.fillStyle='#101b2b';X.fillRect(cx,cy,960,600);for(let x=0;x<2400;x+=80)for(let y=0;y<1500;y+=80){X.fillStyle=(x+y)%160?'#111f31':'#13263a';X.fillRect(x,y,78,78)}for(const w of walls){X.fillStyle='#34485b';X.fillRect(w.x,w.y,w.w,w.h)}for(const l of lamps){X.fillStyle=l.on?'#e7bd5b':'#263343';X.beginPath();X.arc(l.x,l.y,10,0,7);X.fill();if(l.on){X.fillStyle='#604d32';X.beginPath();X.arc(l.x,l.y,70,0,7);X.fill()}}X.fillStyle='#42c5d8';X.fillRect(1178,718,44,44);X.fillStyle=caseTaken?'#65df9b':'#d9a441';X.fillRect(1178,68,44,24);for(const r of rings){X.strokeStyle='#d7aa59';X.globalAlpha=1-r.t;X.lineWidth=3;X.beginPath();X.arc(r.x,r.y,r.r*r.t,0,7);X.stroke();X.globalAlpha=1}for(const g of guards)if(!g.dead){X.fillStyle='#e55b62';X.beginPath();X.arc(g.x,g.y,16,0,7);X.fill()}X.fillStyle=p.inv>0?'#fff':'#6de0ef';X.beginPath();X.arc(p.x,p.y,16,0,7);X.fill();for(const b of bullets){X.fillStyle='#f4e2a6';X.fillRect(b.x-3,b.y-3,6,6)}X.restore();X.fillStyle='#e7f0f7';X.font='16px system-ui';X.fillText('TIME '+time.toFixed(1)+'  LIVES '+lives+'  AMMO '+ammo+'/'+reserve+'  FLARES '+flare,16,24);X.fillText(caseTaken?'OBJECTIVE: REACH NORTH GATE':'OBJECTIVE: TAKE THE CASE',16,48);X.fillText('ALARM '+alarm+'  '+(p.shot>0?'EXPOSED':'QUIET')+'  BEST '+best,16,72);}
function frame(now){if(!last)last=now;let d=Math.min((now-last)/1000,.1);last=now;if(screen==='PLAYING'&&!paused){acc+=d;let n=0;while(n<4&&acc>=1/30){sim(1/30);acc-=1/30;n++}if(n===4&&acc>=1/30)acc=0}render();requestAnimationFrame(frame)}requestAnimationFrame(frame);window.__gameDebug={get state(){return screen},get renderer(){return renderer},get simTick(){return simTick},get score(){return score},get seed(){return seed},get entityCounts(){return{guards:4,lamps:6,terminal:1,exit:1,bullets:bullets.length,rings:rings.length}},reset,startTest};})();
</script><details style="max-width:960px;margin:8px auto;color:#b9cbd5"><summary>About Night Shift</summary><p>Original implementation, inspired by game concepts; not affiliated with Anomaly.</p></details></body></html>
