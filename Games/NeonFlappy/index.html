<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Neon Flappy</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <span id="score">0</span>
  </div>

  <div id="startScreen" class="overlay">
    <div class="panel">
      <h1 class="title">NEON&nbsp;FLAPPY</h1>
      <p class="tagline">Thread the glowing gates. Don't stop flying.</p>
      <div class="controls">
        <span class="key">TAP</span> / <span class="key">CLICK</span> / <span class="key">SPACE</span>
        <span class="ctl-note">to flap upward</span>
      </div>
      <p class="best">BEST: <span id="bestStart">0</span></p>
      <button id="startBtn" class="btn" type="button">START</button>
    </div>
  </div>

  <div id="overScreen" class="overlay hidden">
    <div class="panel">
      <h1 class="title dead">GAME&nbsp;OVER</h1>
      <p class="score-line">SCORE <span id="finalScore">0</span></p>
      <p class="best">BEST: <span id="bestOver">0</span></p>
      <button id="restartBtn" class="btn" type="button">RESTART</button>
      <p class="ctl-note">or press SPACE / TAP</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
