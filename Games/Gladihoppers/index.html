<!DOCTYPE html>
<html lang="en">
<head>
	<!--
	  Attribution / provenance:
	  Vendored Unity WebGL build (v3.0.1, Dreamon Studios) of Gladihoppers,
	  sourced from github.com/1000unblockedgames/Gladihoppers (commit a14cd76).
	  Ad/analytics scripts removed; a local no-op Poki SDK stub keeps it fully
	  offline - the online PvP and IAP buttons are inert without network.
	-->
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<title>Gladihoppers</title>
	<link rel="manifest" href="appmanifest.json">
	<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%E2%9A%94%EF%B8%8F</text></svg>">
	<style>
		* { margin: 0; padding: 0; box-sizing: border-box; }
		html, body { height: 100%; }
		body {
			background: #0b0a12;
			color: #eee;
			font-family: system-ui, "Segoe UI", Roboto, sans-serif;
			overflow: hidden;
			touch-action: none;
		}
		#shell {
			height: 100%;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 12px;
		}
		#frame {
			position: relative;
			width: min(100%, 1280px);
			aspect-ratio: 16 / 9;
			background: #000;
			border: 1px solid #2a2a3a;
			border-radius: 8px;
			overflow: hidden;
		}
		#gameContainer, #gameContainer canvas {
			width: 100%;
			height: 100%;
			display: block;
		}
		#fullscreenBtn:focus-visible, #restartBtn:focus-visible {
			outline: 3px solid #00ff88;
			outline-offset: 3px;
		}
		#hud {
			position: absolute;
			top: 8px;
			right: 8px;
			z-index: 20;
			display: flex;
			gap: 8px;
		}
		#hud button {
			font: 600 13px inherit;
			min-height: 44px;
			padding: 8px 14px;
			border: 1px solid #3b3354;
			border-radius: 8px;
			background: rgba(20, 16, 32, 0.85);
			color: #ddd;
			cursor: pointer;
		}
		#hud button:hover { background: rgba(40, 32, 60, 0.9); }
		#error {
			display: none;
			position: absolute;
			bottom: 8px;
			left: 8px;
			z-index: 20;
			color: #ff8fa3;
			font-size: 14px;
			max-width: 50ch;
			background: rgba(8, 6, 14, 0.9);
			padding: 6px 10px;
			border-radius: 6px;
		}
	</style>
</head>
<body>
	<main id="shell">
		<div id="frame">
			<div id="gameContainer"></div>
			<p id="error"></p>
			<div id="hud">
				<button id="fullscreenBtn" type="button">Fullscreen</button>
				<button id="restartBtn" type="button">Restart</button>
			</div>
		</div>
	</main>
	<script>window.config = {};</script>
	<script>try { Object.defineProperty(document, 'xURL', { get: function () { return document.URL; }, configurable: true }); } catch (e) {}</script>
	<script src="patch/js/UnityLoader.2019.2.js"></script>
	<script src="js/gladihoppers.js"></script>
</body>
</html>
